# Pinned Microsoft WebView2 runtime distribution artifacts (CAP-6b0;
# first real pin ratified in CAP-6b1, second - the offline Evergreen
# Standalone Installer - in CAP-6b2).
#
# Every Microsoft binary this project may ever fetch (Evergreen
# bootstrapper, Standalone Evergreen installer, Fixed Runtime package)
# is pinned here by authoritative URL, expected filename, byte size and
# a SHA-256 computed locally at ratification time - Microsoft publishes
# no digests for these artifacts, so the pin freezes the exact bytes a
# human ratified. tools/get-webview2-runtime.ps1 verifies the SHA-256
# BEFORE any use and deletes the download on any mismatch; an artifact
# without a sha256 is refused outright, so a silently rotated remote
# payload fails loudly by construction. URLs live in this lock only,
# never in swept sources.
#
# Refreshing a pin is an explicit, reviewed act:
#   pwsh tools/get-webview2-runtime.ps1 -Refresh -Artifact <name>
# prints the computed hash/size/Authenticode subject for the human to
# ratify by editing this file; nothing ever writes this file
# automatically, and CI never installs a runtime (fetching the locked,
# verified artifact for embedding is allowed; executing it is not).
#
# Schema (strict 'key = value'; '#' comments and blank lines ignored;
# every malformed line, duplicate key, unknown key or missing required
# key is a hard error naming its line):
#   schema   = 1                          (required, before any artifact)
#   artifact = <unique logical name>      (opens one artifact block)
#   kind     = bootstrapper | standalone | fixed
#   arch     = x64 | x86 | arm64 | neutral
#   version  = <4-part runtime version>   (required for kind = fixed,
#                                          optional for the Evergreen
#                                          installers, whose payload
#                                          version floats by design)
#   url      = <authoritative Microsoft download URL>
#   filename = <expected local filename>
#   size     = <exact byte size>
#   sha256   = <64 lowercase hex chars>
#   authenticode-subject = <exact X.500 leaf-certificate subject>
#                                         (optional second verification
#                                          axis, CAP-6b1: when present,
#                                          fetch-verify additionally
#                                          requires an embedded
#                                          Authenticode signature with
#                                          status Valid AND this exact
#                                          leaf subject, checked AFTER
#                                          the sha256 pass - a valid
#                                          signature never weakens the
#                                          byte-exact sha256 pin)

schema = 1

# CAP-6b1 ratification (2026-08-13): Evergreen Bootstrapper acquired via
# -Refresh, payload inspected and NOT executed. The fwlink URL is the
# Microsoft-documented "Get the Link" distribution mechanism (verified
# 301 -> Microsoft delivery CDN at ratification time). Bootstrapper
# FileVersion at ratification: 1.3.251.23 - recorded as evidence only;
# the runtime payload the bootstrapper installs floats by design, so no
# version key is pinned. Signer evidence: leaf cert valid 2026-04-16 ->
# 2027-04-15 (annual renewal - a thumbprint pin would break yearly);
# issuer 'Microsoft Code Signing PCA 2024' (issuer churns across
# years); root 'Microsoft Root Certificate Authority 2011' thumbprint
# 8F43288AD272F3103B6FB1428485EA3014C0BCFE - evidence, not enforced.
#
# CAP-6b4 RE-RATIFICATION (2026-08-14): Microsoft rotated the payload
# behind the same fwlink - the drift cadence deferred-work.md predicted
# ("every rotation turns CI red until a human re-ratifies the lock, by
# ratified design"). The fetch refused the new bytes and deleted them,
# exactly as designed; the pin below was then re-ratified by explicit
# human decision after -Refresh evidence. What changed: size
# 1695960 -> 1708760 and the sha256 below. What did NOT change: the
# fwlink URL, the filename, and the Authenticode leaf subject - the new
# payload verifies 'Valid' with the byte-exact subject already pinned
# here, so the independent second axis agreed with the new bytes before
# the digest was accepted. Payload inspected via -Refresh and NOT
# executed. The superseded digest was
# 8c4a80540b6bbcbef30a4e8c7d1ac504b6fc09db922b4acdfd85c9d5f6f1050e.
#
# CAP-6b4 URL RE-PIN (2026-08-15): the fwlink is abandoned as the pinned
# url, because a byte-exact sha256 CANNOT be pinned against it. It is a
# "latest" redirector by construction, and Microsoft shipped THREE
# distinct bootstrappers in three days (8c4a8054 -> 4f29c936 ->
# be695eb3, sizes 1695960 -> 1708760 -> 1780952), so every rotation
# turned hosted CI red within a day. Verified NOT to be per-network CDN
# variance: three consecutive fetches from the dev host returned the
# same digest the hosted runner got.
#
# The fwlink 301s to a per-build file under Microsoft's delivery CDN -
# https://go.microsoft.com/fwlink/p/?LinkId=2124703 resolved to the url
# below on 2026-08-15 - and THAT is what is pinned now: the same
# immutable-URL shape the CAP-6b3 Fixed Runtime entry has always used,
# which is the one artifact in this lock that has never drifted once.
# The fwlink remains the documented discovery mechanism and is how a
# future -Refresh finds the next build's url; it is simply no longer
# the thing a byte-exact digest is pinned against. Nothing about the
# verification semantics changed: sha256 first, then size, then
# Authenticode 'Valid' with the exact leaf subject, delete on any miss.
# Payload acquired via -Refresh, inspected and NOT executed.
artifact = evergreen-bootstrapper
kind = bootstrapper
arch = neutral
url = https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/09d01e8e-f1ac-43a6-b5a0-282e0778a4b6/MicrosoftEdgeWebview2Setup.exe
filename = MicrosoftEdgeWebview2Setup.exe
size = 1780952
sha256 = be695eb3732a94e181f008ab5cf6ee650f8644676e87f9e02b6ab0d02f2ea08e
authenticode-subject = CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US

