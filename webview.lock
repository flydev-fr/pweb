# PWeb Linux x64 baseline (CAP-7L). Ratified, never autodetected: upstream's
# pkg_search_module fallback (webkitgtk-6.0 -> 4.1 -> 4.0) must never decide
# which engine we build against, so every configure passes
# -DWEBVIEW_WEBKITGTK_API and the build asserts the resolved module in
# CMakeCache.txt. The soname is what FPC records as DT_NEEDED (MEASURED), so
# it - not the chet LibraryName - is the file the release layout ships.
linux-webkitgtk-api = 4.1
linux-gtk-api = 3.0
linux-soname = libwebview.so.0.12

# SHA256 of the ratified CAP-7L src/lib platform-block patch. src/lib stays
# pinned by BOTH freeze sweeps at their ORIGINAL CAP-1/CAP-3 baselines; instead
# of requiring an empty diff they require EXACTLY this patch, so the anchors
# survive and any drift past the ratified three lines still fails. The hash is
# taken over `git diff --no-color --no-ext-diff --full-index <baseline> --
# src/lib` with line endings normalised to LF and one trailing LF, which is
# stable on both the Windows and the Linux runner.
cap7l-binding-patch-sha256 = 3bd45f60703f91f6fc32697efd21f77c8d5d2470bfa97784beec6f223c84434b

