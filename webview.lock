# PWeb Linux x64 baseline (CAP-7L). Ratified, never autodetected: upstream's
# pkg_search_module fallback (webkitgtk-6.0 -> 4.1 -> 4.0) must never decide
# which engine we build against, so every configure passes
# -DWEBVIEW_WEBKITGTK_API and the build asserts the resolved module in
# CMakeCache.txt. The soname is what FPC records as DT_NEEDED (MEASURED), so
# it - not the chet LibraryName - is the file the release layout ships.
linux-webkitgtk-api = 4.1
linux-gtk-api = 3.0
linux-soname = libwebview.so.0.12

# PWeb macOS baseline (CAP-7M0 -- MEASUREMENT SHARD, awaiting ratification).
# Nothing here is autodetected and nothing is left to the runner's Xcode SDK.
#
# The dylib names come from the SAME pinned upstream version that already
# produced linux-soname: core/include/webview/version.h is 0.12.0, so CMake's
# VERSION is 0.12.0 and its SOVERSION (WEBVIEW_VERSION_COMPATIBILITY) is 0.12.
# On Apple that yields the real file libwebview.0.12.0.dylib plus the
# compatibility name libwebview.0.12.dylib and the link-time name
# libwebview.dylib. macos-dylib is what the chet [Platform.Mac*] LibraryName
# says and therefore what FPC asks the linker for; macos-dylib-versioned is
# what the LC_LOAD_DYLIB command ends up naming, exactly as DT_NEEDED records
# the SONAME and not the chet name on Linux.
#
# macos-install-name-prefix is the ratified STRATEGY, not a measurement: the
# artifact must carry an @rpath-relative install name so a bundle can resolve
# it through LC_RPATH from @executable_path. An absolute build-tree install
# name fails tools/build-webview-dylib.sh. The exact observed string is
# recorded by that script (otool -D) rather than pinned here, because M3
# measures it.
#
# The deployment target is PROPOSED by this shard, not yet ratified: 12.0 is
# the first macOS branch carrying WebKit's "custom scheme handled origins
# should be considered secure" change, which is the whole basis for expecting
# pweb://app to be a secure context. M15/M16 must confirm both halves before
# CAP-7M may rely on it.
macos-dylib = libwebview.dylib
macos-dylib-versioned = libwebview.0.12.dylib
macos-dylib-real = libwebview.0.12.0.dylib
macos-install-name-prefix = @rpath/
macos-deployment-target = 12.0
macos-runner-x64 = macos-15-intel
macos-runner-arm64 = macos-15
macos-arch-x64 = x86_64
macos-arch-arm64 = arm64

# SHA256 of the ratified src/lib platform-block patch. src/lib stays pinned by
# BOTH freeze sweeps at their ORIGINAL CAP-1/CAP-3 baselines; instead of
# requiring an empty diff they require EXACTLY this patch, so the anchors
# survive and any drift past the ratified lines still fails. The hash is taken
# over `git diff --no-color --no-ext-diff --full-index <baseline> -- src/lib`
# with line endings normalised to LF and one trailing LF, which is stable on
# the Windows, the Linux and the macOS runner.
#
# CAP-7M0 re-derived this VALUE: the patch carries the Linux branch AND the
# two Darwin branches ([Platform.MacARM]/[Platform.MacIntel] enabled in the
# committed chet config, regenerated through
# tools/regen-webview-binding.ps1). Re-deriving it was verified to produce the
# SAME hash from both baselines, which is the only thing that makes the
# two-sweep arrangement work.
#
# CAP-7M1 renamed the KEY. The previous name began with the CAP-7L capability
# id, which named ONE platform for a patch that now carries three - a misnomer
# CAP-7M0 ledgered rather than fixed, because renaming it rewrites the exact
# `windows:` steps whose byte-stability CAP-7M0's acceptance asserted. The
# VALUE is byte-preserved: this is a rename, never a re-ratification, and both
# baselines were re-verified to produce this same hash.
#
# The old spelling is deliberately NOT written out anywhere in this file. A
# dedicated `windows:` gate FAILS if it reappears here at all - a rename with
# no rejection gate leaves the old name working by accident - and that gate
# builds the string it searches for by concatenation so it cannot match its
# own source, exactly as the floating-upstream-ref guards do.
srclib-platform-patch-sha256 = 255927608d7e6b1172211ddb8ce9e0057699ec117c6d0455c4c0c789d7d81988

