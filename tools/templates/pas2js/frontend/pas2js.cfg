# {{PROJECT_NAME}} - the Pas2JS compile options this project owns.
#
# Passed to the compiler as `@pas2js.cfg`, which is read IN ADDITION to the
# compiler's own configuration - that one supplies the RTL unit paths and
# belongs to the installation, not to this project.
#
# WHAT IS DELIBERATELY NOT HERE: the unit path of the PWeb Pas2JS SDK, and
# the output path. Both are absolute, both belong to the machine doing the
# build, and writing either of them into this file would make the project
# depend on where its framework happens to live. They are passed as
# arguments beside this file.
#
# -Jc concatenates the RTL into one output file and declares `rtl` without
# starting it, which is why the page loads a one-line assets/boot.js after
# assets/app.js. That is the ratified PWeb bootstrap: no inline script, so
# the native Content-Security-Policy keeps script-src 'self' with no
# 'unsafe-inline'.
-Tbrowser
-Jc
-Jirtl.js
-O1
