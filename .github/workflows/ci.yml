      # and the public pack from CAP-10B1, so those run first and CAP-10A's
      # build takes the one CLI they produced.
      - name: CAP-10B0 build the scaffold engine, the pack and the suite
        shell: bash
        timeout-minutes: 15
        run: test/cap10b0/build_cap10b0.sh

      - name: CAP-10B1 build the public pack, the CLI and the SDK root
        shell: bash
        timeout-minutes: 15
        run: test/cap10b1/build_cap10b1.sh

      - name: CAP-10A build the suite and the probe fixture
        shell: bash
        timeout-minutes: 15
        run: test/cap10a/build_cap10a.sh

      - name: CAP-10A contract cross-checks (pins, no shell, no network)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10a/check_cap10a_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10A contract cross-checks FAILED' }

      - name: CAP-10A development-trust gate
        shell: pwsh
