          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 build proof FAILED' }

      - name: CAP-10B2 upload the pas2js corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
