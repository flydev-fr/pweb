          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap10c3/cli-macos-x86_64.json
            build/cap10c3/contracts.json
            build/cap10c3/ledger.json
            build/cap10c3/devpas2js-corpus.txt
            build/cap10c3/devpas2js-observed.txt
            build/cap10c3/c3tests.log
