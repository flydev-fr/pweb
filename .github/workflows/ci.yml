        timeout-minutes: 25
        run: test/cap10c3/build_cap10c3.sh
      - name: CAP-10C3 contract cross-checks (bounds, detector linkage, no watch API, pas2js CSP + dev-free release)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10c3/check_cap10c3_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10C3 contract cross-checks FAILED' }
      - name: CAP-10C3 the CAP-10C ledger disposition (CL2, CL3)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10c3/check_cap10c_ledger.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10C ledger disposition FAILED' }

      - name: CAP-10C3 pas2js development-loop gates (PD1-PD15, RD1, T1-T5, CL1-CL3) + evidence
        shell: bash
        timeout-minutes: 70
        run: |
          pwsh -NoProfile -File test/cap10c3/run_cap10c3_gates.ps1 2>&1 |
            tee build/cap10c3-gates.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: CAP-10C3 upload the pas2js development corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
