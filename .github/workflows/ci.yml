            build/cap7m/abi/fcntl.diff
            build/cap7m/probe/
            build/cap7m/gates/
            build/cap7m/runtime/
            build/cap7m/release/
            build/cap7m/release-apps/
            build/cap7m/nonetwork/

  # ================= CAP-7M0: macOS feasibility (arm64) ====================
  # The x64 sibling above, on Apple Silicon. Everything that differs is the
  # runner label and the expected architecture; everything that matters is
  # measured separately, because "it works on macOS" is not a claim this
  # project is allowed to make from one architecture.
  macos-arm64:
    name: macos-arm64 (Cocoa + WKWebView)
    runs-on: macos-15
    concurrency:
      group: cap7m-macos-arm64-${{ github.ref }}
      cancel-in-progress: true
    env:
      CAP7M_EXPECT_ARCH: arm64
      CAP7M_RUNNER_LABEL: macos-15
    # See the x64 sibling: raised from 60 by CAP-7M1 and again by CAP-7M2,
    # for the same reasons.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard - no floating upstream ref in the macOS build/gate path
        shell: bash
        run: |
          pat="git[[:space:]]+(cl""one|pu""ll|ls-rem""ote)"
          pat="${pat}|re""fs/(he""ads|ta""gs)"
          pat="${pat}|webview/web""view@"
          files="tools/build-webview-dylib.sh tools/get-fpc-macos.ps1"
          files="${files} tools/macos-buildenv.sh tools/build-macos-bridge.sh"
          files="${files} test/cap7m/cap7m_common.sh test/cap7m/build_cap7m.sh"
          files="${files} test/cap7m/check_abi.sh test/cap7m/check_webview_exports.sh"
          files="${files} test/cap7m/run_cap7m_probes.sh"
          files="${files} test/cap7m/run_cap7m_gates.sh"
          files="${files} test/cap7m/run_cap7m_runtime.sh"
          files="${files} test/cap7m/check_release_layout.sh"
          files="${files} test/cap7m/check_cap7m_nonetwork.sh"
          files="${files} test/cap7m/summarize_cap7m.sh"
          files="${files} test/cap7m/build_cap7m_release.sh"
          files="${files} test/cap7m/run_cap7m_release.sh"
          bad=0
          for f in ${files}; do
            # EXISTENCE FIRST. grep on a missing path exits 2, the `if` takes
            # the false branch, and the loop concludes "clean" for a file it
            # never read - so a renamed or deleted gate would silently empty
            # this guard instead of failing it.
            if [ ! -f "${f}" ]; then
              echo "MISSING GUARD TARGET: ${f}"
              bad=1
              continue
            fi
            if grep -nEi "${pat}" "${f}"; then
              echo "VIOLATION: ${f}"
              bad=1
            fi
          done
          [ "${bad}" -eq 0 ] || { echo 'floating upstream ref detected'; exit 1; }
          echo "guard: no floating upstream ref in the macOS path ($(echo ${files} | wc -w) files)"
          grep -qE '^macos-sha256 = [0-9a-f]{64}$' fpc.lock ||
            { echo 'fpc.lock does not pin a full sha256 for the macOS artifact'; exit 1; }

      - name: CAP-7M0 record the runner (M19)
        shell: bash
        run: |
          echo "runner label: macos-15"
          echo "uname -m:     $(uname -m)"
          sw_vers
          echo "xcode (image default, NOT what the gates use):"
          xcodebuild -version || true
          echo "available Xcode installs:"
          ls -1 /Applications | grep -i '^Xcode' || true
          [ "$(uname -m)" = "${CAP7M_EXPECT_ARCH}" ] ||
            { echo "runner is $(uname -m), expected ${CAP7M_EXPECT_ARCH}"; exit 1; }
          # No proc_translated check here, deliberately: nothing running under
          # Rosetta ever reports arm64, so the assertion above already
          # excludes translation on this leg. The check that matters lives in
          # the x64 job, which is the one a translated process could pass.
          echo 'arch: native arm64 (translation cannot report arm64)'

      - name: Fetch pinned webview/webview (exact SHA, checksum verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-webview.ps1

      - name: Fetch pinned mORMot2 (exact SHA + sha256-pinned statics)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-mormot.ps1

      # The pinned FPC disk image is ~262 MiB and both macOS jobs fetch the
      # same bytes on every push. It is keyed on fpc.lock, so a re-pin
      # invalidates it automatically, and get-fpc-macos.ps1 re-verifies the
      # sha256 AND the md5 of whatever it finds before using it - a poisoned
      # or truncated cache entry fails the same way a bad download does.
      - name: CAP-7M0 cache the pinned FPC disk image
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: build/cap7m/toolchain/fpc-macos.dmg
          key: cap7m-fpc-dmg-${{ hashFiles('fpc.lock') }}

      - name: CAP-7M0 install pinned FPC and select the pinned Xcode
        shell: pwsh
        timeout-minutes: 25
        run: pwsh -NoProfile -File tools/get-fpc-macos.ps1

      - name: CAP-7M0 deps/webview carries no macOS patch
        shell: bash
        run: |
          dirty="$(git -C deps/webview status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "${dirty}"
            echo 'deps/webview was modified on the macOS path'
            exit 1
          fi
          echo 'deps/webview: pristine at the pinned commit'

      - name: CAP-7M0 build libwebview.dylib from pinned source (M1/M3/M16)
        shell: bash
        timeout-minutes: 20
        # No --clean: the runner checks out fresh, so the working
        # directories do not exist yet. These gates never delete on their
        # default path; a stale tree is a refusal, and --clean is for
        # repeated LOCAL runs only.
        run: tools/build-webview-dylib.sh

      - name: CAP-7M0 public ABI remains exactly 17 exports (M2)
        shell: bash
        run: test/cap7m/check_webview_exports.sh

      - name: CAP-7M0 paired ABI probes + Mach-O presence and dlopen gates (M4/M5)
        shell: bash
        timeout-minutes: 15
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/check_abi.sh

      # ONE SHIPPED DYLIB, ONE LINKED OBJECT, NOTHING ELSE. The production
      # Cocoa bridge is an object file linked into each binary that hosts a
      # macOS WebView - deps/webview stays unpatched and the public export
      # surface stays at exactly 17.
      - name: CAP-7M1 compile the production Cocoa bridge (one object)
        shell: bash
        timeout-minutes: 10
        run: tools/build-macos-bridge.sh

      - name: CAP-7M0 compile the binding, mORMot core and the probe (M17)
        shell: bash
        timeout-minutes: 20
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/build_cap7m.sh

      # The full PWeb suite on Darwin, including the CAP-7M1 adapter cases and
      # - for the first time - TTestAssetStores, which could not even
      # construct here before FinalPathOfFd grew an fcntl(F_GETPATH) body.
      # Plus the real-symlink folder-confinement probe the Windows junction
      # fixture cannot express, run twice from two working directories.
      - name: CAP-7M1 headless gates (suite + folder confinement)
        shell: bash
        timeout-minutes: 20
        run: test/cap7m/run_cap7m_gates.sh

      # Three cycles: one of each shutdown shape, plus a third so the M6 leak
      # bound has a baseline that is not the cache-populating first cycle.
      - name: CAP-7M0 feasibility probes (M6-M15)
        shell: bash
        timeout-minutes: 25
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/run_cap7m_probes.sh 3

      # THE ACCEPTANCE CRITERION IN THE FLESH: a real WKWebView, the
      # production adapter, folder AND zip stores over one corpus, the frozen
      # scheduler/binding/mORMot path to 42, both shutdown shapes, and the
      # whole thing again from `/` with every DYLD_* hint stripped. No mocked
      # WebKit, no browser substitute, no SKIP path.
      - name: CAP-7M1 production runtime gates (real WKWebView, folder + zip)
        shell: bash
        timeout-minutes: 30
        run: test/cap7m/run_cap7m_runtime.sh 3

      # ------------------- CAP-7M2: release .app products -------------------
      # The x64 sibling's block, on Apple Silicon. One real difference, and
      # it is the ratified one: no aarch64-darwin Pas2JS 3.0.1 binary exists
      # upstream and Rosetta is banned, so tools/get-pas2js.ps1 compiles the
      # SAME pinned logical version natively from the pinned FPC-repo
      # revision, then asserts -iV AND lipo -archs before anything uses it.
      - name: CAP-7M2 setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      - name: CAP-7M2 TypeScript SDK build + tests
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd sdk/typescript
          npm ci
          npm test
          cd ../..
          for f in sdk/typescript/dist/src/index.js \
                   sdk/typescript/dist/src/index.d.ts; do
            [ -f "${f}" ] || { echo "SDK build output missing: ${f}"; exit 1; }
          done

      - name: CAP-7M2 React frontend build (pinned lockfile, offline bundle)
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd examples/04-react/frontend
          npm ci
          npm run typecheck
          npm run build
          cd ../../..
          for f in examples/04-react/frontend/dist/index.html \
                   examples/04-react/frontend/dist/assets/app.js; do
            [ -f "${f}" ] || { echo "react frontend output missing: ${f}"; exit 1; }
          done

      - name: CAP-7M2 fetch pinned pas2js (sha256 + native compile) and build its frontend
        shell: pwsh
        timeout-minutes: 20
        run: |
          pwsh -NoProfile -File tools/get-pas2js.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pinned pas2js fetch/native compile FAILED' }
          pwsh -NoProfile -File examples/05-pas2js/frontend/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pas2js frontend build FAILED' }
          foreach ($f in 'examples/05-pas2js/frontend/dist/index.html',
                         'examples/05-pas2js/frontend/dist/assets/app.js') {
            if (-not (Test-Path $f)) { throw "pas2js frontend output missing: $f" }
          }

      - name: CAP-7M2 compile the release host and bundler
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/build_cap7m_release.sh

      - name: CAP-7M2 release .app gates - assembly, refusals, direct + LaunchServices to 42
        shell: bash
        timeout-minutes: 30
        run: test/cap7m/run_cap7m_release.sh

      - name: CAP-7M2 release manifests and inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap7m2-release-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/cap7m/release-apps/manifest-react.txt
            build/cap7m/release-apps/manifest-pas2js.txt
            build/cap7m/release-apps/inventory-react.txt
            build/cap7m/release-apps/inventory-pas2js.txt

      - name: CAP-7M0 bundle layout measured from an unrelated CWD (M18)
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/check_release_layout.sh

      - name: CAP-7M0 zero-transport proof (M20)
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/check_cap7m_nonetwork.sh

      # ---------- CAP-8B: the real-window privileged-navigation matrix ----------
      # The production gate that replaced the Checkpoint-1 audit probe, on
      # WKWebView, natively on THIS architecture - the runner names its
      # nav-matrix record from `uname -m`, so this leg's result can never be
      # filed as the x64 leg's. Every failure gates.
      - name: CAP-8B real-window navigation matrix (WKWebView)
        shell: bash
        timeout-minutes: 20
        run: test/cap8b/run_nav_matrix.sh

      - name: CAP-8B upload the macOS arm64 nav-matrix record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8b-nav-matrix-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8b/nav-matrix.json
            build/cap8b/nav-matrix-posix.log

      # ---------- CAP-8C: the multi-principal integration harness ----------
      # The production gate that replaced the Checkpoint-1 topology probe, on
      # WKWebView, natively on this architecture - the harness names its
      # record from its own compile-time target id, so this leg's result can
      # never be filed as the x64 leg's. Same two legs (native decision
      # corpus + two real principals under the shared policy), every failure
      # gates. Runs BEFORE the CAP-7F emitter.
      - name: CAP-8C multi-principal integration harness (WKWebView)
        shell: bash
        timeout-minutes: 20
        run: test/cap8c/run_multiprincipal.sh

      - name: CAP-8C upload the macOS arm64 multiprincipal record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8c-multiprincipal-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8c/multiprincipal-macos-arm64.json
            build/cap8c/security-corpus.txt
            build/cap8c/multiprincipal-posix.log

      # CAP-9A: see the x64 sibling - the runner builds the pinned QuickJS
      # object with clang (no darwin artifact in the pinned release), links
      # it, runs the headless Q1-Q30 matrix and the paired C/Pascal ABI
      # diff. On aarch64-darwin the production unit additionally exports
      # the pas_* heap family the pinned NOLIBCSTATIC define removes from
      # mormot.lib.static. Runs BEFORE the CAP-7F emitter.
      - name: CAP-9A QuickJS invocation foundation harness
        shell: bash
        timeout-minutes: 20
        run: test/cap9a/run_quickjsfoundation.sh

      - name: CAP-9A upload the macOS arm64 quickjs record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9a-quickjs-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9a/quickjsfoundation-macos-arm64.json
            build/cap9a/quickjs-corpus.txt
            build/cap9a/abi-pascal.txt
            build/cap9a/abi-c.txt
            build/cap9a/qjs-obj/quickjs-build-info.txt
            build/cap9a/quickjsfoundation-posix.log

      # CAP-9B1: see the x64 sibling - the same headless, fixture-free
      # P1-P40 package/module matrix over the CI-built pinned QuickJS
      # object, producing the fourth quickjs_package_digest the aggregate
      # requires to be equal. Runs BEFORE the CAP-7F emitter.
      - name: CAP-9B1 QuickJS package and module-loader harness
        shell: bash
        timeout-minutes: 20
        run: test/cap9b1/run_quickjspackage.sh

      - name: CAP-9B1 upload the macOS arm64 package record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9b1-package-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9b1/quickjspackage-macos-arm64.json
            build/cap9b1/quickjs-package-corpus.txt
            build/cap9b1/quickjspackage-posix.log

      # CAP-9B2: see the x64 sibling - the same headless L1-L40 lifecycle and
      # reload matrix over the CI-built pinned QuickJS object, producing the
      # fourth quickjs_lifecycle_digest the aggregate requires to be equal.
      # Runs BEFORE the CAP-7F emitter.
      - name: CAP-9B2 QuickJS plugin lifecycle and reload harness
        shell: bash
        timeout-minutes: 30
        run: test/cap9b2/run_quickjslifecycle.sh

      - name: CAP-9B2 upload the macOS arm64 lifecycle record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9b2-lifecycle-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9b2/quickjslifecycle-macos-arm64.json
            build/cap9b2/quickjs-lifecycle-corpus.txt
            build/cap9b2/quickjslifecycle-posix.log

      # CAP-9C1: see the x64 sibling - the same staged-twice determinism
      # check, the same generated-registry compile, the same C1-C30 matrix.
      - name: CAP-9C1 QuickJS release package and trusted loader harness
        shell: bash
        timeout-minutes: 30
        run: test/cap9c1/run_quickjsrelease.sh

      - name: CAP-9C1 upload the macOS arm64 release record and payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9c1-release-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9c1/quickjsrelease-macos-arm64.json
            build/cap9c1/quickjs-release-corpus.txt
            build/cap9c1/quickjsrelease-posix.log
            build/cap9c1/pwebqjspack-posix.log
            build/quickjs-release/

      # CAP-9C2: see the Windows job for the rationale.
      - name: CAP-9C2 plugin-enabled acceptance frontend build
        shell: bash
        timeout-minutes: 10
        run: |
          cd examples/07-quickjs/frontend
          npm ci
          npm run typecheck
          npm run build
          cd ../../..
          for f in examples/07-quickjs/frontend/dist/index.html \
                   examples/07-quickjs/frontend/dist/assets/app.js; do
            [ -f "${f}" ] || { echo "quickjs frontend output missing: ${f}"; exit 1; }
          done

      # A real WKWebView inside a real PWebQuickJS.app bundle, driven
      # while two QuickJS plugin threads run beside it.
      - name: CAP-9C2 plugin-enabled release layout and real-GUI acceptance
        shell: bash
        timeout-minutes: 40
        run: test/cap9c2/run_quickjsgui.sh

      - name: CAP-9C2 upload the macOS arm64 plugin-enabled record and layout
        # always(): a gate that fails while its diagnostics sit in a skipped
        # upload costs a whole hosted cycle to learn nothing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9c2-gui-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9c2/quickjsgui-macos-arm64.json
            build/cap9c2/quickjs-gui-corpus.txt
            build/cap9c2/host-rows.txt
            build/cap9c2/hostile-rows.txt
            build/cap9c2/runner-rows.txt
            build/cap9c2/quickjsgui-posix.log

      # CAP-7F: see the x64 sibling - the emitter summarizes gates that
      # already ran above in this job and re-enumerates the export trie.
      # CAP-10A: the public pweb CLI (see the windows job for the rationale)
      # BUILD ORDER (see the windows job): `pweb` compiles the GENERATED
      # template registry in with -Fi, so it cannot be built before the pack
      # that registry describes exists. The pack builder comes from CAP-10B0
      # and the public pack from CAP-10B1, so those run first and CAP-10A's
      # build takes the one CLI they produced.
      - name: CAP-10B0 build the scaffold engine, the pack and the suite
        shell: bash
        timeout-minutes: 15
        run: test/cap10b0/build_cap10b0.sh

      - name: CAP-10B1 build the public pack, the CLI and the SDK root
        shell: bash
        timeout-minutes: 15
        run: test/cap10b1/build_cap10b1.sh

      - name: CAP-10A build the suite and the probe fixture
        shell: bash
        timeout-minutes: 15
        run: test/cap10a/build_cap10a.sh

      - name: CAP-10A contract cross-checks (pins, no shell, no network)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10a/check_cap10a_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10A contract cross-checks FAILED' }

      - name: CAP-10A development-trust gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10a/check_dev_trust.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10A dev-trust gate FAILED' }

      - name: CAP-10A CLI gates + evidence
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap10a/run_cap10a_gates.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10A gates FAILED' }

      - name: CAP-10A upload the CLI corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap10a-cli-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/cap10a/cli-macos-arm64.json
            build/cap10a/cli-corpus.txt
            build/cap10a/doctor.json
            build/cap10a/doctor-human.txt
            build/cap10a/dev-trust.txt
            build/cap10a/clitests.log

      # CAP-10B0: the scaffold engine, built above with CAP-10B1's pack (see
      # the windows job for the rationale).
      - name: CAP-10B0 contract cross-checks (create linked, offline, limits)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10b0/check_cap10b0_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B0 contract cross-checks FAILED' }

      - name: CAP-10B0 scaffold gates + evidence
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap10b0/run_cap10b0_gates.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B0 gates FAILED' }

      - name: CAP-10B0 upload the scaffold corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap10b0-template-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/cap10b0/tpl-macos-arm64.json
            build/cap10b0/tpl-corpus.txt
            build/cap10b0/contracts.json
            build/cap10b0/gen/pweb.templates.registry.inc
            build/cap10b0/tpltests.log

      # CAP-10B1: the public create command and the React scaffold (see the
      # windows job for the layering, and the macos-x64 job for the .app
      # assembly). Two different CPUs, and the GENERATED project must be
      # byte-identical on both of them.
      - name: CAP-10B1 contract cross-checks (one UI, exact pins, no exec)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10b1/check_cap10b1_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B1 contract cross-checks FAILED' }

      - name: CAP-10B1 create gates + evidence
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap10b1/run_cap10b1_gates.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B1 create gates FAILED' }

      - name: CAP-10B1 private build proof and real GUI run
        shell: bash
        timeout-minutes: 30
        run: test/cap10b1/prove_cap10b1.sh

      - name: CAP-10B1 upload the create corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap10b1-create-macos-arm64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap10b1/cli-macos-arm64.json
            build/cap10b1/proof-macos-arm64.json
            build/cap10b1/contracts.json
            build/cap10b1/generated-inventory.txt
            build/cap10b1/gen/pweb.templates.registry.inc
            build/cap10b1/proof.log

      # CAP-10B2: the public Pas2JS scaffold (see the windows job for the
      # layering). THE NO-ROSETTA LEG: upstream publishes no aarch64 Pas2JS,
      # so this job compiles the pinned logical version natively from the
      # pinned FPC revision, and prove_cap10b2.sh asserts `-iSP` is aarch64
      # before it compiles anything with it.
      - name: CAP-10B2 build the react-only CLI that proves template_unknown
        shell: bash
        timeout-minutes: 15
        run: test/cap10b2/build_cap10b2.sh

      - name: CAP-10B2 contract cross-checks (two UIs, one native app, no npm)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10b2/check_cap10b2_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 contract cross-checks FAILED' }

      - name: CAP-10B2 pas2js create gates + evidence
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap10b2/run_cap10b2_gates.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 create gates FAILED' }

      - name: CAP-10B2 private build proof and real GUI run
        shell: bash
        timeout-minutes: 30
