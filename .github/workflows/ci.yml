# CAP-1 minimal Windows CI (phase-plan.md: starts at Phase 1, not Phase 11),
# extended by CAP-2: every CAP-1 gate is kept verbatim; CAP-2 adds the
# webview-free scheduler compile, the headless invocation-pipeline test cases
# inside pwebtests, and the JS-binding example compile (gating) with a
# best-effort non-gating run, mirroring the CAP-1 smoke policy.
#
# Invariants honoured here:
# - The upstream fetch is the EXACT pinned SHA from webview.lock, checksum
#   cross-checked (tools/get-webview.ps1). No branch, tag, or floating ref of
#   webview/webview appears anywhere in this workflow, and a guard step scans
#   the fetch/build scripts and this file for floating-ref forms.
# - mORMot2 (test/app layer ONLY -- src/lib stays mORMot-free) is pinned the
#   same way: exact SHA + sha256-pinned statics archive in mormot.lock,
#   fetched by tools/get-mormot.ps1. The test suite pwebtests.pas runs on
#   mormot.core.test with /noenter.
# - Third-party actions are pinned to full commit SHAs (tag in comment).
# - ABI tests run at full strength: the C probe (pinned headers, MSVC) and
#   the Pascal probe (committed binding, FPC) must emit byte-identical
#   reports, and all 17 pinned entry points must be exported by a DLL built
#   from the pinned source.
# - Binding regeneration itself (chet-cli) is a LOCAL gate: ChetCLI is a
#   host-installed tool not redistributed in this repo; the committed
#   pipeline is tools/regen-webview-binding.ps1. CI instead proves the
#   committed binding against the pinned headers (probe diff + signature-pin
#   compile + symbol coverage + surface check), which fails on any drift a
#   regeneration would reveal.
# - The GUI smoke RUN is a documented human/local gate; CI compiles it and
#   attempts an auto-closing run without letting an absent desktop session
#   fail the build, recording the outcome in the step summary.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for freeze diff against baseline)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pinned webview/webview (exact SHA, checksum verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-webview.ps1

      - name: Fetch pinned mORMot2 (exact SHA + sha256-pinned statics)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-mormot.ps1

      - name: Guard - no floating upstream ref in fetch/build path
        shell: pwsh
        run: |
          # Any git form that could follow a moving ref is a violation in the
          # scripts that touch upstream, and in this workflow itself.
          # (Patterns are concatenated so they cannot literally match their
          # own source in this file.)
          $pat = 'git\s+(cl' + 'one|pu' + 'll|ls-rem' + 'ote)' +
                 '|refs/(he' + 'ads|ta' + 'gs)' +
                 '|fetch[^\r\n]*origin[^\r\n]*\b(mas' + 'ter|HE' + 'AD|ma' + 'in)\b' +
                 '|webview/web' + 'view@'
          $files = 'tools/get-webview.ps1', 'tools/get-mormot.ps1',
                   'tools/build-webview-dll.ps1', '.github/workflows/ci.yml'
          $bad = @()
          foreach ($f in $files) {
            $hit = Select-String -Path $f -Pattern $pat
            if ($hit) { $bad += "${f}: $($hit[0].Line.Trim())" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "VIOLATION: $_" }; throw 'floating upstream ref detected' }
          foreach ($lf in 'webview.lock', 'mormot.lock') {
            $lock = Get-Content $lf -Raw
            if ($lock -notmatch 'commit\s*=\s*[0-9a-f]{40}') {
              throw "$lf does not pin a full 40-char SHA"
            }
          }
          Write-Host 'guard: no floating upstream ref'

      - name: Install FPC (Lazarus 3.4 ships FPC 3.2.2)
        uses: gcarreno/setup-lazarus@d633fa79b45e29794ab46ec31f7543e44e02efef # v3
        with:
          lazarus-version: "3.4"

      - name: Assert FPC 3.2.2
        shell: pwsh
        run: |
          $v = (fpc -iV).Trim()
          Write-Host "fpc version: $v"
          if ($v -ne '3.2.2') { throw "expected FPC 3.2.2, got $v" }

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: CAP-3U - FPC 3.2.2 Win64 CallMethod unwind and Currency ABI
        shell: pwsh
        run: |
          # FPC 3.2.2 Win64 emits no unwind metadata for mORMot's private
          # CallMethod assembler and returns Currency in RAX, unlike its
          # Double/TDateTime XMM0 convention. Exercise the exact pinned fix
          # before any mORMot PPU can mask the conditional replacement.
          $stale = @(Get-ChildItem -Path . -Recurse `
            -Filter mormot.core.interfaces.ppu -File -ErrorAction SilentlyContinue)
          if ($stale) {
            throw "stale mormot.core.interfaces.ppu before CAP-3U: $($stale.FullName -join '; ')"
          }
          $targetOs = (fpc -iTO).Trim().ToLowerInvariant()
          $targetCpu = (fpc -iTP).Trim().ToLowerInvariant()
          if (($targetOs -cne 'win64') -or ($targetCpu -cne 'x86_64')) {
            throw "CAP-3U requires FPC target Win64/x86_64, got $targetOs/$targetCpu"
          }
          try {
            foreach ($attempt in 1..2) {
              pwsh -NoProfile -File tools/patch-cap3u.ps1
              if ($LASTEXITCODE -ne 0) {
                throw "CAP-3U preparation attempt $attempt failed"
              }
            }

            New-Item -ItemType Directory -Force build/cap3u/fpc,
              build/cap3u/bin | Out-Null
            fpc -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap3u/fpc -FEbuild/cap3u/bin `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              test/cap3u/cap3u_unwind.pas 2>&1 |
              Tee-Object build/cap3u/compile.log
            if ($LASTEXITCODE -ne 0) { throw 'CAP-3U compile failed' }

            $compile = Get-Content build/cap3u/compile.log -Raw
            if ($compile -notmatch
                'Compiling .*deps[\\/]mormot2[\\/]src[\\/]core[\\/]mormot\.core\.interfaces\.pas') {
              throw 'CAP-3U unit provenance did not compile repository mormot.core.interfaces'
            }
            $ppus = @(Get-ChildItem -Path . -Recurse `
              -Filter mormot.core.interfaces.ppu -File)
            $expectedPpu = (Resolve-Path `
              build/cap3u/fpc/mormot.core.interfaces.ppu).Path
            if (($ppus.Count -ne 1) -or ($ppus[0].FullName -cne $expectedPpu)) {
              throw "CAP-3U unit provenance escaped dedicated -FU: $($ppus.FullName -join '; ')"
            }

            $binaryLines = @(pwsh -NoProfile -File `
              test/cap3u/check_unwind.ps1 `
                -ObjectPath deps/mormot2/src/core/x64callmethod.obj `
                -ExecutablePath build/cap3u/bin/cap3u_unwind.exe `
                -MapPath build/cap3u/bin/cap3u_unwind.map 2>&1)
            $binaryCode = $LASTEXITCODE
            $binaryLines | Tee-Object -FilePath build/cap3u/binary.log |
              Write-Host
            if ($binaryCode -ne 0) { throw 'CAP-3U final-PE unwind gate failed' }

            $runtimeLines = @(& build/cap3u/bin/cap3u_unwind.exe 2>&1)
            $runtimeCode = $LASTEXITCODE
            $runtimeLines | Tee-Object -FilePath build/cap3u/runtime.log |
              Write-Host
            if (($runtimeCode -ne 0) -or
                (($runtimeLines -join "`n") -notmatch 'CAP3U: 12/12 PASS')) {
              throw 'CAP-3U runtime matrix failed'
            }
          }
          finally {
            $restoreFailures = @()
            foreach ($attempt in 1..2) {
              pwsh -NoProfile -File tools/patch-cap3u.ps1 -Restore
              if ($LASTEXITCODE -ne 0) { $restoreFailures += $attempt }
            }
            if ($restoreFailures) {
              throw "CAP-3U restore attempts failed: $($restoreFailures -join ', ')"
            }
          }
          $lockedCommit = ((Select-String -Path mormot.lock `
            -Pattern '^commit\s*=').Line -split '=', 2)[1].Trim()
          $dependencyHead = (git -C deps/mormot2 rev-parse HEAD).Trim()
          if (($LASTEXITCODE -ne 0) -or ($dependencyHead -cne $lockedCommit)) {
            throw "mORMot HEAD $dependencyHead differs from lock $lockedCommit"
          }
          git -C deps/mormot2 diff --exit-code `
            $dependencyHead -- `
            src/core/mormot.core.interfaces.pas
          if ($LASTEXITCODE -ne 0) { throw 'CAP-3U source is not pristine after restore' }
          if (Test-Path deps/mormot2/src/core/x64callmethod.obj) {
            throw 'CAP-3U object survived restore'
          }

      - name: Build webview.dll from pinned source (cmake + MSVC)
        shell: pwsh
        run: pwsh -NoProfile -File tools/build-webview-dll.ps1

      - name: Compile binding units (FPC, ObjFPC mode)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fpc | Out-Null
          fpc -MObjFPC -Sh -B -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.pas
          if ($LASTEXITCODE -ne 0) { throw 'core unit failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.types.pas
          if ($LASTEXITCODE -ne 0) { throw 'types unit failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.errors.pas
          if ($LASTEXITCODE -ne 0) { throw 'errors unit failed' }

      # CAP-2: the scheduler MUST compile with no src/webview unit path and
      # no mORMot path - proving it is source-generic and RTL-only, per the
      # frozen "defined over invocation sources" rule. The other new units
      # compile with exactly the dependencies the layering allows them.
      - name: Compile CAP-2 units (scheduler proven webview-free)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fpc-rpc, build/fpc-cap2 | Out-Null
          # the neutral support unit must stay RTL-only over pweb.rpc.intf
          # alone: compiled with -Fusrc/rpc ONLY so any webview/mORMot/
          # platform dependency creeping in fails this gate
          fpc -MObjFPC -Sh -B -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.support.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.support.pas failed its RTL-only intf-only compile' }
          fpc -MObjFPC -Sh -B -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.scheduler.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.scheduler.pas failed its webview-free RTL-only compile' }
          fpc -MObjFPC -Sh -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.bridge.dummy.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.bridge.dummy.pas failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc-rpc -Fusrc/rpc -Fusrc/security src/security/pweb.capabilities.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.capabilities.pas failed' }
          # the binding may use pinned mORMot2 core units (project include
          # pattern); src/lib alone stays mORMot-free
          fpc -Sh -B -FUbuild/fpc-cap2 -Fusrc/lib -Fusrc/rpc -Fusrc/webview `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/webview/pweb.webview.binding.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.webview.binding.pas failed' }

      - name: Signature pin (compile-only gate over all 17 prototypes)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test | Out-Null
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fideps/mormot2/src -FEbuild/test test/core/signature_pin.pas
          if ($LASTEXITCODE -ne 0) { throw 'signature pin failed: binding signatures drifted' }

      - name: ABI probe - Pascal side (committed binding)
        shell: pwsh
        run: |
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fideps/mormot2/src -FEbuild/test test/core/abi_probe.pas
          if ($LASTEXITCODE -ne 0) { throw 'pascal probe compile failed' }
          & build/test/abi_probe.exe > build/test/abi_pascal.txt
          if ($LASTEXITCODE -ne 0) { throw "pascal probe exited $LASTEXITCODE" }
          Get-Content build/test/abi_pascal.txt

      - name: ABI probe - C side (pinned headers, MSVC)
        shell: cmd
        run: |
          cl /nologo /W4 /WX /Ideps\webview\core\include test\core\abi_probe.c /Fobuild\test\ /Febuild\test\abi_probe_c.exe
          if errorlevel 1 exit /b 1
          build\test\abi_probe_c.exe > build\test\abi_c.txt
          if errorlevel 1 exit /b 1
          type build\test\abi_c.txt

      - name: ABI probe - compare (any diff is a blocker)
        shell: pwsh
        run: |
          # Strict, order-sensitive, line-by-line comparison; a suspiciously
          # small fact count (e.g. empty-vs-empty) is itself a failure.
          $c = @(Get-Content build/test/abi_c.txt)
          $p = @(Get-Content build/test/abi_pascal.txt)
          if ($c.Count -lt 30) { throw "C probe emitted only $($c.Count) facts -- expected >= 30" }
          if ($c.Count -ne $p.Count) { throw "ABI probe mismatch: $($c.Count) vs $($p.Count) lines" }
          $bad = 0
          for ($i = 0; $i -lt $c.Count; $i++) {
            if ($c[$i] -cne $p[$i]) { Write-Host "MISMATCH line $($i+1): C='$($c[$i])' Pas='$($p[$i])'"; $bad++ }
          }
          if ($bad) { throw "ABI probe mismatch: $bad line(s)" }
          Write-Host "ABI probes identical: $($c.Count) facts"

      # mormot.core.test suite: CAP-1 (error helpers + 17/17 symbol coverage)
      # plus the twenty CAP-2 invocation-pipeline cases, all headless (the
      # binding cases run against injected fake native functions - no window;
      # the DLL is staged only because the binding unit's production defaults
      # import it at load time). /noenter skips the interactive ENTER wait;
      # the suite sets a nonzero exit code on any failed assertion.
      - name: PWeb test suite (mormot.core.test)
        shell: pwsh
        run: |
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fusrc/rpc -Fusrc/security `
            -Fusrc/webview -Futest/core -Futest/rpc -Fideps/mormot2/src `
            -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt -Fudeps/mormot2/src/net `
            -FEbuild/test test/core/pwebtests.pas
          if ($LASTEXITCODE -ne 0) { throw 'pwebtests compile failed' }
          Copy-Item build/webview-dist/webview.dll build/test/
          $env:PWEB_WEBVIEW_DLL = (Resolve-Path build/webview-dist/webview.dll).Path
          & build/test/pwebtests.exe /noenter
          if ($LASTEXITCODE -ne 0) { throw 'pwebtests suite FAILED' }

      - name: Binding surface + freeze-isolation sweeps
        shell: pwsh
        run: pwsh -NoProfile -File test/core/check_binding_surface.ps1

      - name: Freeze sweep - RTL-only compile of isolation-critical intf units
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/freeze | Out-Null
          # pweb.rpc.intf.pas must compile with the bare RTL: proves no
          # webview/platform unit crept into the scheduler contract.
          fpc -MObjFPC -Sh -B -FUbuild/freeze src/rpc/pweb.rpc.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.intf.pas is not RTL-only' }
          fpc -MObjFPC -Sh -B -FUbuild/freeze src/webview/pweb.webview.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.webview.intf.pas failed RTL-only compile' }

      - name: Freeze sweep - frozen contracts byte-identical to Phase-0 baseline
        shell: pwsh
        run: |
          git diff --exit-code b2f04dc4c478c72b1699a954dd52e76b207e918b -- `
            src/rpc/pweb.rpc.intf.pas `
            src/webview/pweb.webview.intf.pas `
            src/assets/pweb.assets.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'frozen Phase-0 contract units were modified' }

      - name: Freeze sweep - raw ABI layer byte-identical to CAP-1 baseline
        shell: pwsh
        run: |
          # src/lib is regenerated only via the committed pipeline on a
          # ratified pin bump - never edited during a feature phase.
          git diff --exit-code 709bf0fee715d0cf9b8c475b4f801947fc0f4a65 -- src/lib
          if ($LASTEXITCODE -ne 0) { throw 'src/lib (raw ABI layer) was modified without a ratified pin bump' }

      - name: Compile smoke example and stage its DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/example | Out-Null
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib -FEbuild/example examples/01-hello/hello.pas
          if ($LASTEXITCODE -ne 0) { throw 'smoke example failed to compile' }
          Copy-Item build/webview-dist/webview.dll build/example/

      # The real smoke RUN (window visible, marker rendered, clean exit) is a
      # documented human/local gate; this best-effort attempt runs it with
      # auto-close where the runner image has WebView2 + a desktop session.
      # Outcome is recorded in the step summary; a SKIP (no usable
      # session/runtime -> webview_create returns nil) is distinguished from
      # a genuine failure. Non-gating per spec.
      - name: Smoke run (best effort - authoritative gate is local)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $out = & build/example/hello.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            $verdict = 'PASS - window ran and exited cleanly'
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code (see log)"
          }
          "### Smoke run (non-gating)`n$verdict" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "smoke verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      - name: Compile JS-binding example (CAP-2) and stage its DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/example2 | Out-Null
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fusrc/rpc -Fusrc/security `
            -Fusrc/webview -Fideps/mormot2/src `
            -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt -Fudeps/mormot2/src/net `
            -FEbuild/example2 examples/02-js-binding/jsbinding.pas
          if ($LASTEXITCODE -ne 0) { throw 'JS-binding example failed to compile' }
          Copy-Item build/webview-dist/webview.dll build/example2/

      # Same policy as the CAP-1 smoke: the authoritative RUN (window visible,
      # concurrent JS invocations resolving) is a documented human/local gate;
      # CI attempts an auto-closing run without letting an absent desktop
      # session fail the build. Non-gating per spec.
      - name: JS-binding example run (best effort - authoritative gate is local)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $out = & build/example2/jsbinding.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            $verdict = 'PASS - JS binding example ran and exited cleanly'
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code (see log)"
          }
          "### JS-binding example run (non-gating)`n$verdict" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "jsbinding verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap1-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test/abi_c.txt
            build/test/abi_pascal.txt
            build/webview-dist/webview.dll
            build/cap3u/compile.log
            build/cap3u/binary.log
            build/cap3u/runtime.log
            build/cap3u/bin/cap3u_unwind.map
