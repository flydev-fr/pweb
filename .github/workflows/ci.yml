  # ========================= CAP-7L: Linux x64 =========================
  # A SEPARATE job, not a matrix leg. Every step above stays on
  # windows-latest and is untouched; nothing here needs anything from
  # there, so the two run independently and a Linux failure never
  # obscures a Windows one (nor the reverse).
  #
  # ONE RATIFIED STACK, stated and asserted, never autodetected:
  # GTK 3 + WebKitGTK API 4.1 (webkit2gtk-4.1, libsoup3), x86_64, glibc.
  # The dev packages are installed explicitly here; the APPLICATION never
  # installs anything, and there is deliberately no Linux counterpart to
  # the Windows runtime provisioning (no Linux CAP-13).
  #
  # The GUI gates have NO conditional SKIP, unlike their Windows
  # siblings. A hosted Windows runner may genuinely lack a WebView2
  # runtime or a desktop session; this job always supplies a real
  # display through xvfb-run, so a real GTK/WebKitGTK WebView opening is
  # a precondition and every failure gates.
  linux:
    name: linux-x64 (GTK 3 + WebKitGTK 4.1)
    runs-on: ubuntu-24.04
    # A healthy full run measures a few minutes: the library build is one
    # translation unit, and the GUI gates are auto-closing. This is a hang
    # ceiling with room for the npm and pinned-toolchain fetches.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard - no floating upstream ref in the Linux build/gate path
        shell: bash
        run: |
          # The same invariant the Windows job enforces over its own
          # scripts, extended to the ones CAP-7L adds. Patterns are
          # concatenated so they cannot literally match their own source.
          pat="git[[:space:]]+(cl""one|pu""ll|ls-rem""ote)"
          pat="${pat}|re""fs/(he""ads|ta""gs)"
          pat="${pat}|webview/web""view@"
          files="tools/build-webview-so.sh test/cap7l/build_cap7l.sh"
          files="${files} test/cap7l/check_abi.sh test/cap7l/check_webview_exports.sh"
          files="${files} test/cap7l/run_cap7l_gates.sh test/cap7l/run_gui_matrix.sh"
          files="${files} test/cap7l/run_release_layout.sh"
          files="${files} test/cap7l/check_cap7l_nonetwork.sh"
          bad=0
          for f in ${files}; do
            # EXISTENCE FIRST (CAP-7M1, closing the CAP-7M0 ledger entry).
            # grep on an absent path exits 2, the `if` takes the false branch,
            # and the loop concludes "clean" for a file it never read - so
            # deleting or renaming a guarded script silently REMOVED it from
            # the guard instead of failing it.
            if [ ! -f "${f}" ]; then
              echo "MISSING GUARD TARGET: ${f}"
              bad=1
              continue
            fi
            if grep -nEi "${pat}" "${f}"; then
              echo "VIOLATION: ${f}"
              bad=1
            fi
          done
          [ "${bad}" -eq 0 ] || { echo 'floating upstream ref detected'; exit 1; }
          echo 'guard: no floating upstream ref in the Linux path'

          # Every gate below is invoked as a program, not as `bash <file>`, so
          # a script committed 100644 fails with 'Permission denied' before a
          # single assertion runs - and it does so identically whether the
          # gate would have passed or failed. A dev host never notices,
          # because calling `bash script.sh` ignores the mode bit entirely.
          # Assert the committed MODE, not the working-tree mode: on a
          # Windows checkout the filesystem has no executable bit and only
          # git's index carries the truth.
          nonexec="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')"
          if [ -n "${nonexec}" ]; then
            echo 'shell gates committed without the executable bit:'
            printf '  %s\n' ${nonexec}
            echo 'fix with: git update-index --chmod=+x <file>'
            exit 1
          fi
          echo "guard: all $(git ls-files -- '*.sh' | wc -l) committed shell gates are executable"

      - name: Install the ratified WebKitGTK stack and FPC (distro packages)
        shell: bash
        timeout-minutes: 15
        run: |
          sudo apt-get update
          # Exactly the ratified baseline plus a real virtual display.
          # webkitgtk-6.0 is deliberately NOT installed: the build asserts
          # which module pkg-config resolved, and an unratified engine on
          # the machine must fail that assertion rather than be chosen.
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config ninja-build build-essential \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb x11-utils xauth \
            fpc binutils
          echo "gtk+-3.0      $(pkg-config --modversion gtk+-3.0)"
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)"

      - name: Assert the toolchain and the ratified engine family
        shell: bash
        run: |
          v="$(fpc -iV | tr -d '[:space:]')"
          echo "fpc version: ${v}"
          # conventions.md: FPC 3.2.2 is the minimum; the dev host runs
          # 3.2.3 and CAP-7L is proven on both.
          case "${v}" in
            3.2.2|3.2.3) ;;
            *) echo "unsupported FPC ${v}"; exit 1 ;;
          esac
          os="$(fpc -iTO | tr -d '[:space:]')"
          cpu="$(fpc -iTP | tr -d '[:space:]')"
          echo "fpc target: ${os}/${cpu}"
          [ "${os}" = 'linux' ] || { echo "expected linux target"; exit 1; }
          [ "${cpu}" = 'x86_64' ] || { echo 'CAP-7L is x86_64 only'; exit 1; }
          # the lock is the single source for the Linux baseline
          grep -qx 'linux-webkitgtk-api = 4.1' webview.lock ||
            { echo 'webview.lock does not pin WebKitGTK API 4.1'; exit 1; }
          grep -qx 'linux-gtk-api = 3.0' webview.lock ||
            { echo 'webview.lock does not pin GTK API 3.0'; exit 1; }
          grep -qx 'linux-soname = libwebview.so.0.12' webview.lock ||
            { echo 'webview.lock does not pin the Linux soname'; exit 1; }

      # pwsh is preinstalled on the ubuntu-24.04 image, so the pinned
      # fetch/verify logic stays SINGLE-SOURCE: the exact same scripts the
      # Windows job runs, with the same sha256 and exact-SHA checks. A bash
      # twin of a security-critical verifier is precisely what this avoids.
      - name: Fetch pinned webview/webview (exact SHA, checksum verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-webview.ps1

      - name: Fetch pinned mORMot2 (exact SHA + sha256-pinned statics)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-mormot.ps1

      - name: CAP-7L build libwebview.so from pinned source (cmake + gcc)
        shell: bash
        timeout-minutes: 15
        run: tools/build-webview-so.sh

      # The acceptance criterion in the flesh: the Linux port reaches
      # pweb://app through the seam upstream already exposes, so the
      # dependency tree must be pristine - no Linux patch exists, and this
      # job never applies the Windows one.
      - name: CAP-7L deps/webview carries no Linux patch
        shell: bash
        run: |
          dirty="$(git -C deps/webview status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "${dirty}"
            echo 'deps/webview was modified on the Linux path'
            exit 1
          fi
          echo 'deps/webview: pristine at the pinned commit'

      - name: CAP-7L public ABI remains exactly 17 exports (nm -D)
        shell: bash
        run: test/cap7l/check_webview_exports.sh

      - name: CAP-7L paired ABI probes + hand-declared symbol presence gate
        shell: bash
        timeout-minutes: 10
        run: test/cap7l/check_abi.sh

      - name: CAP-7L setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      # The React example depends on the SDK by PATH
      # ("@pweb/runtime": "file:../../../sdk/typescript"), and that package
      # resolves its types to ./dist/src/index.d.ts - a tsc output that is
      # gitignored. So the SDK must be BUILT before the frontend typechecks,
      # exactly as the Windows job does it; skipping it fails with
      # "Cannot find module '@pweb/runtime'" rather than anything Linux.
      # npm test is npm run build plus the SDK's own suite, so this proves
      # the TypeScript SDK on Linux node while producing what React needs.
      - name: CAP-7L TypeScript SDK build + tests
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd sdk/typescript
          npm ci
          npm test
          cd ../..
          for f in sdk/typescript/dist/src/index.js \
                   sdk/typescript/dist/src/index.d.ts; do
            [ -f "${f}" ] || { echo "SDK build output missing: ${f}"; exit 1; }
          done

      - name: CAP-7L React frontend build (pinned lockfile, offline bundle)
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd examples/04-react/frontend
          npm ci
          npm run typecheck
          npm run build
          cd ../../..
          for f in examples/04-react/frontend/dist/index.html \
                   examples/04-react/frontend/dist/assets/app.js; do
            [ -f "${f}" ] || { echo "react frontend output missing: ${f}"; exit 1; }
          done

      # Same pinned Pas2JS 3.0.1 as the Windows job, its linux-x86_64
      # artifact, sha256-verified into deps/pas2js-linux. Same frontend
      # sources, same SDK, same compiler version: L17 is a parity proof,
      # not a second frontend path.
      - name: CAP-7L fetch pinned pas2js (sha256-verified) and build its frontend
        shell: pwsh
        timeout-minutes: 10
        run: |
          pwsh -NoProfile -File tools/get-pas2js.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pinned pas2js fetch FAILED' }
          pwsh -NoProfile -File examples/05-pas2js/frontend/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pas2js frontend build FAILED' }
          foreach ($f in 'examples/05-pas2js/frontend/dist/index.html',
                         'examples/05-pas2js/frontend/dist/assets/app.js') {
            if (-not (Test-Path $f)) { throw "pas2js frontend output missing: $f" }
          }

      - name: CAP-7L compile every unit, probe and example for Linux
        shell: bash
        timeout-minutes: 20
        run: test/cap7l/build_cap7l.sh

      - name: CAP-7L headless gates - suite, POSIX store confinement, packaging
        shell: bash
        timeout-minutes: 15
        run: test/cap7l/run_cap7l_gates.sh

      # A GENUINE virtual display, and a real GTK/WebKitGTK WebView on it.
      # No mocked rendering, no headless-DOM substitute, no SKIP path.
      - name: CAP-7L GUI matrix (L4-L22) under Xvfb
        shell: bash
        timeout-minutes: 20
        run: xvfb-run -a test/cap7l/run_gui_matrix.sh

      - name: CAP-7L release layout - React and Pas2JS to 42 from an isolated dir
        shell: bash
        timeout-minutes: 15
        run: xvfb-run -a test/cap7l/run_release_layout.sh

      - name: CAP-7L zero-transport proof (L20)
        shell: bash
        timeout-minutes: 10
        run: xvfb-run -a test/cap7l/check_cap7l_nonetwork.sh

      # ------------------------- CAP-7F closure -------------------------
      # Additive, after every existing gate: the args gate executes the
      # CAP-7M2 host arguments on Linux for the first time (deferred-work
      # D1), on the release layout run_release_layout.sh assembled above;
      # the emitter then writes the per-target evidence for cap7-aggregate.
      # No conditional SKIP here - the virtual display is real, so every
      # failure gates, same policy as the other Linux GUI gates.
      - name: CAP-7F host-argument gate on the release layout (closes D1 on Linux)
        shell: bash
        timeout-minutes: 10
        run: xvfb-run -a test/cap7f/run_host_args_gate.sh

      # ---------- CAP-8B: the real-window privileged-navigation matrix ----------
      # The production gate that replaced the Checkpoint-1 audit probe, on the
      # WebKitGTK engine, under a real virtual display. It is load-bearing
      # here in a way it is not on Windows: CAP-8B MEASURED that the raw
      # __webview__ transport reaches the native binding from EVERY frame on
      # WebKitGTK, so the matrix's child tripwire (no untrusted subframe may
      # execute) and frame-src 'none' proof are what stand between a subframe
      # and the privileged bridge. No conditional SKIP - the display is real,
      # every failure gates - same policy as the CAP-7L GUI matrix.
      - name: CAP-8B real-window navigation matrix (WebKitGTK) under Xvfb
        shell: bash
        timeout-minutes: 20
        run: xvfb-run -a test/cap8b/run_nav_matrix.sh

      - name: CAP-8B upload the Linux nav-matrix record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8b-nav-matrix-linux
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8b/nav-matrix.json
            build/cap8b/nav-matrix-posix.log

      # ---------- CAP-8C: the multi-principal integration harness ----------
      # The production gate that replaced the Checkpoint-1 topology probe, on
      # the WebKitGTK engine, under a real virtual display. The headless
      # NATIVE leg writes the canonical security-corpus.txt (the cross-target
      # digest source) and the GUI leg of two simultaneously live WebKitGTK
      # windows proves the shared policy differentiates two real principals
      # with the content-swap + injected-opener evidence. No conditional SKIP
      # - the display is real, every failure gates, same policy as the
      # nav-matrix. It runs BEFORE the CAP-7F emitter (which reads its
      # verdict into security_corpus and hashes the corpus into
      # security_corpus_digest).
      - name: CAP-8C multi-principal integration harness (WebKitGTK) under Xvfb
        shell: bash
        timeout-minutes: 20
        run: xvfb-run -a test/cap8c/run_multiprincipal.sh

      - name: CAP-8C upload the Linux multiprincipal record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8c-multiprincipal-linux
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8c/multiprincipal-linux-x86_64.json
            build/cap8c/security-corpus.txt
            build/cap8c/multiprincipal-posix.log

      # CAP-9A: the QuickJS invocation-foundation harness. Fully headless
      # (no display needed): the pinned x86_64-linux quickjs.o from the
      # sha256-pinned mORMot statics, the Q1-Q30 matrix and the paired
