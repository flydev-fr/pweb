        with:
          name: cap8b-nav-matrix-windows
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8b/nav-matrix.json
            build/cap8b/nav-matrix-win.log

      # ---------- CAP-8C: the multi-principal integration harness ----------
