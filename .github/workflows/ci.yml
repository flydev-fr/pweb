            build/cap10c2/devdrv-report.txt
            build/cap10c2/devdrv-report.txt.lines
            build/cap10c2/devdrv-stdout.txt
            build/cap10c2/devdrv-stderr.txt
            build/cap10c2/devdrv-killhost.txt
            build/cap10c2/devdrv-killhost.txt.lines
            build/cap10c2/devdrv-killwatcher.txt
            build/cap10c2/devdrv-killwatcher.txt.lines
            build/cap10c2/dev14-stderr.txt
            build/cap10c2/dev9-stderr.txt
            build/cap10c2-gates.log
      - name: CAP-10C3 build the pas2js development suite, the driver and both host binaries
        shell: bash
        timeout-minutes: 25
        run: test/cap10c3/build_cap10c3.sh
      - name: CAP-10C3 contract cross-checks (bounds, detector linkage, no watch API, pas2js CSP + dev-free release)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10c3/check_cap10c3_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10C3 contract cross-checks FAILED' }
      - name: CAP-10C3 the CAP-10C ledger disposition (CL2, CL3)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10c3/check_cap10c_ledger.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10C ledger disposition FAILED' }

      - name: CAP-10C3 pas2js development-loop gates (PD1-PD15, RD1, T1-T5, CL1-CL3) + evidence
        shell: bash
        timeout-minutes: 70
        run: |
          xvfb-run -a pwsh -NoProfile -File test/cap10c3/run_cap10c3_gates.ps1 2>&1 |
            tee build/cap10c3-gates.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: CAP-10C3 upload the pas2js development corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap10c3-devpas2js-linux
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap10c3/cli-linux-x86_64.json
            build/cap10c3/contracts.json
            build/cap10c3/ledger.json
            build/cap10c3/devpas2js-corpus.txt
            build/cap10c3/devpas2js-observed.txt
            build/cap10c3/c3tests.log
            build/cap10c3/p2jdrv-report.txt
            build/cap10c3/p2jdrv-report.txt.lines
            build/cap10c3/p2jdrv-stdout.txt
            build/cap10c3/p2jdrv-stderr.txt
            build/cap10c3/p2jdrv-killhost.txt
            build/cap10c3/p2jdrv-killhost.txt.lines
            build/cap10c3/p2j-live-stderr.txt
            build/cap10c3/pipe-stdout.txt
            build/cap10c3/pipe-stderr.txt
            build/cap10c3-gates.log
      - name: CAP-10D0 build the public-build suite and its driver
        shell: bash
        timeout-minutes: 20
        run: test/cap10d0/build_cap10d0.sh
      - name: CAP-10D0 contract cross-checks (one execution path, ten stages, five commands, gate quoting)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10d0/check_cap10d0_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10D0 contract cross-checks FAILED' }

      - name: CAP-10D0 public-build gates (B1-B12, L1-L3, R1-R2) + evidence
        shell: bash
        timeout-minutes: 120
        run: |
          pwsh -NoProfile -File test/cap10d0/run_cap10d0_gates.ps1 2>&1 |
            tee build/cap10d0-gates.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: CAP-10D0 upload the public-build corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap10d0-build-linux
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap10d0/cli-linux-x86_64.json
            build/cap10d0/contracts.json
            build/cap10d0/build-corpus.txt
            build/cap10d0/build-observed.txt
            build/cap10d0/d0tests.log
            build/cap10d0/builddrv-report.txt
            build/cap10d0/builddrv-report.txt.lines
            build/cap10d0/builddrv-stdout.txt
            build/cap10d0/builddrv-stderr.txt
            build/cap10d0/cli-stderr.txt
            build/cap10d0-gates.log
      - name: CAP-7F emit the Linux evidence artifact
        shell: bash
        timeout-minutes: 10
        run: test/cap7f/emit_evidence.sh

      - name: CAP-7F upload the Linux evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap7f-evidence-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            build/cap7f/evidence.json
            build/cap7f/host-args.json
            build/cap7f/manifest-react.txt
            build/cap7f/manifest-pas2js.txt

      - name: CAP-7F diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap7f-diagnostics-linux
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap7f/
            build/cap9a/
            build/cap9b1/
            build/cap9b2/
            build/cap9c1/
            build/quickjs-release/

      - name: CAP-7L diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap7l-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap7l/abi/abi_c.txt
            build/cap7l/abi/abi_pascal.txt
            build/cap7l/abi/gtk_c.txt
            build/cap7l/abi/gtk_pas.txt
            build/cap7l/pwebtests.log
            build/cap7l/gui/
            build/cap7l/release/
            build/cap7l/webview-build/CMakeCache.txt

  # ================== CAP-7M0: macOS feasibility (x86_64) ==================
  # TWO SEPARATE JOBS, not a matrix. Every step above stays exactly where it
  # is: `windows:` and `linux:` are byte-untouched, nothing here needs
  # anything from either, and a macOS failure never obscures one of theirs
  # (nor the reverse). The two macOS legs are separate from EACH OTHER for
  # the same reason - "one arch failing is reported, never silently dropped"
  # is an acceptance criterion, and a matrix leg that quietly reuses the
  # other's cache is exactly how that goes wrong.
  #
  # THIS SHARD MEASURES. It builds no macOS adapter, ports no example and
  # packages nothing: the artifacts are the export gate, the paired ABI
  # probe, a throwaway Objective-C++ feasibility probe and a throwaway
  # bundle. What it produces is a record.
  #
  # NOTHING IS INHERITED FROM THE RUNNER. FPC comes from a sha256-pinned
  # artifact (fpc.lock, never `brew install`), Xcode is selected from a
  # pinned candidate list rather than left at the image default, and the
  # deployment target is passed on every compile and link instead of being
  # decided by whatever SDK the image happens to ship.
  #
  # There is no conditional SKIP on the GUI gates, unlike their Windows
  # siblings. A hosted Windows runner may genuinely lack a WebView2 runtime
  # or a desktop session; a hosted macOS runner always has a real
  # WindowServer/Aqua session, so a real WKWebView opening is a precondition
  # and every failure gates.
  #
  # COST: the repository is private and this workflow has no branch filter,
  # so every push now runs four jobs, and macOS minutes bill at 10x the
  # included-minute rate. Batch probe changes into one push rather than
  # iterating one gate at a time.
  macos-x64:
    name: macos-x64 (Cocoa + WKWebView)
    runs-on: macos-15-intel
    # JOB-LEVEL, never workflow-level: a workflow-level concurrency group
    # would also govern `windows:` and `linux:`, and those two jobs are
    # byte-untouched by this shard. Superseded macOS runs are cancelled
    # because they bill at 10x and a stale one proves nothing.
    concurrency:
      group: cap7m-macos-x64-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Asserted by every gate before it accepts a result. A job that thinks
      # it is the x64 leg while running somewhere else is precisely the
      # failure that would otherwise be reported as parity.
      CAP7M_EXPECT_ARCH: x86_64
      CAP7M_RUNNER_LABEL: macos-15-intel
    # A healthy full run is a few minutes: the library build is one
    # translation unit and every GUI leg is watchdog-bounded. This is a hang
    # ceiling with room for the ~260 MB pinned toolchain fetch. CAP-7M1 raised
    # it from 60 because the per-step budgets it adds (10 bridge + 20 headless
    # + 30 runtime) no longer fit under the old ceiling; CAP-7M2 raised it
    # again (frontend toolchains + the release build and gates add their own
    # per-step budgets). As everywhere else in this workflow the JOB budget is
    # a BACKSTOP, and what actually protects a hang is the per-step budget,
    # which lets the failure diagnostics upload still run.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard - no floating upstream ref in the macOS build/gate path
        shell: bash
        run: |
          # The same invariant the Windows and Linux jobs enforce over their
          # own scripts, extended to the ones CAP-7M0 and CAP-7M1 add.
          # Patterns are concatenated so they cannot literally match their own
          # source.
          pat="git[[:space:]]+(cl""one|pu""ll|ls-rem""ote)"
          pat="${pat}|re""fs/(he""ads|ta""gs)"
          pat="${pat}|webview/web""view@"
          files="tools/build-webview-dylib.sh tools/get-fpc-macos.ps1"
          files="${files} tools/macos-buildenv.sh tools/build-macos-bridge.sh"
          files="${files} test/cap7m/cap7m_common.sh test/cap7m/build_cap7m.sh"
          files="${files} test/cap7m/check_abi.sh test/cap7m/check_webview_exports.sh"
          files="${files} test/cap7m/run_cap7m_probes.sh"
          files="${files} test/cap7m/run_cap7m_gates.sh"
          files="${files} test/cap7m/run_cap7m_runtime.sh"
          files="${files} test/cap7m/check_release_layout.sh"
          files="${files} test/cap7m/check_cap7m_nonetwork.sh"
          files="${files} test/cap7m/summarize_cap7m.sh"
          files="${files} test/cap7m/build_cap7m_release.sh"
          files="${files} test/cap7m/run_cap7m_release.sh"
          bad=0
          for f in ${files}; do
            # EXISTENCE FIRST. grep on a missing path exits 2, the `if` takes
            # the false branch, and the loop concludes "clean" for a file it
            # never read - so a renamed or deleted gate would silently empty
            # this guard instead of failing it.
            if [ ! -f "${f}" ]; then
              echo "MISSING GUARD TARGET: ${f}"
              bad=1
              continue
            fi
            if grep -nEi "${pat}" "${f}"; then
              echo "VIOLATION: ${f}"
              bad=1
            fi
          done
          [ "${bad}" -eq 0 ] || { echo 'floating upstream ref detected'; exit 1; }
          echo "guard: no floating upstream ref in the macOS path ($(echo ${files} | wc -w) files)"
          # the lock this job introduces pins by digest, not by URL
          grep -qE '^macos-sha256 = [0-9a-f]{64}$' fpc.lock ||
            { echo 'fpc.lock does not pin a full sha256 for the macOS artifact'; exit 1; }

      # M19: the runner is identified BEFORE any gate is accepted, so a
      # measurement can never be attributed to the wrong machine after the
      # fact. The arch assertion is here as well as inside every gate
      # because a mislabelled runner must fail the job, not a probe.
      - name: CAP-7M0 record the runner (M19)
        shell: bash
        run: |
          echo "runner label: macos-15-intel"
          echo "uname -m:     $(uname -m)"
          sw_vers
          echo "xcode (image default, NOT what the gates use):"
          xcodebuild -version || true
          echo "available Xcode installs:"
          ls -1 /Applications | grep -i '^Xcode' || true
          [ "$(uname -m)" = "${CAP7M_EXPECT_ARCH}" ] ||
            { echo "runner is $(uname -m), expected ${CAP7M_EXPECT_ARCH}"; exit 1; }
          # THE ANTI-ROSETTA GATE BELONGS HERE, on the x64 leg. A translated
          # process reports x86_64 from `uname -m` perfectly honestly, so it
          # is THIS job - not the arm64 one - that an Apple Silicon runner
          # under Rosetta would silently satisfy, and a translated run is
          # never authoritative x64 evidence. On the arm64 leg the same check
          # is unreachable by construction: nothing translated ever reports
          # arm64, so `uname -m` = arm64 already settles it there.
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = "1" ]; then
            echo 'this job is running under Rosetta'; exit 1
          fi
          if [ "$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)" = "1" ]; then
            echo 'this runner is Apple Silicon but reports x86_64 -- translated shell'
            exit 1
          fi
          echo 'arch: native x86_64, not translated'

      # pwsh is preinstalled on the hosted macOS images, so the pinned
      # fetch/verify logic stays SINGLE-SOURCE: the exact same scripts the
      # Windows and Linux jobs run, with the same sha256 and exact-SHA
      # checks. A bash twin of a security-critical verifier is precisely
      # what this avoids.
      - name: Fetch pinned webview/webview (exact SHA, checksum verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-webview.ps1

      - name: Fetch pinned mORMot2 (exact SHA + sha256-pinned statics)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-mormot.ps1

      # The pinned FPC disk image is ~262 MiB and both macOS jobs fetch the
      # same bytes on every push. It is keyed on fpc.lock, so a re-pin
      # invalidates it automatically, and get-fpc-macos.ps1 re-verifies the
      # sha256 AND the md5 of whatever it finds before using it - a poisoned
      # or truncated cache entry fails the same way a bad download does.
      - name: CAP-7M0 cache the pinned FPC disk image
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: build/cap7m/toolchain/fpc-macos.dmg
          key: cap7m-fpc-dmg-${{ hashFiles('fpc.lock') }}

      - name: CAP-7M0 install pinned FPC and select the pinned Xcode
        shell: pwsh
        timeout-minutes: 25
        run: pwsh -NoProfile -File tools/get-fpc-macos.ps1

      # The acceptance criterion in the flesh: the macOS path reaches
      # pweb://app through a PWeb-owned seam outside the library, so the
      # dependency tree must be pristine - the CAP-4W patch is Windows-only
      # and this job never applies it.
      - name: CAP-7M0 deps/webview carries no macOS patch
        shell: bash
        run: |
          dirty="$(git -C deps/webview status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "${dirty}"
            echo 'deps/webview was modified on the macOS path'
            exit 1
          fi
          echo 'deps/webview: pristine at the pinned commit'

      - name: CAP-7M0 build libwebview.dylib from pinned source (M1/M3/M16)
        shell: bash
        timeout-minutes: 20
        # No --clean: the runner checks out fresh, so the working
        # directories do not exist yet. These gates never delete on their
        # default path; a stale tree is a refusal, and --clean is for
        # repeated LOCAL runs only.
        run: tools/build-webview-dylib.sh

      - name: CAP-7M0 public ABI remains exactly 17 exports (M2)
        shell: bash
        run: test/cap7m/check_webview_exports.sh

      - name: CAP-7M0 paired ABI probes + Mach-O presence and dlopen gates (M4/M5)
        shell: bash
        timeout-minutes: 15
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/check_abi.sh

      # ONE SHIPPED DYLIB, ONE LINKED OBJECT, NOTHING ELSE. The production
      # Cocoa bridge is an object file linked into each binary that hosts a
      # macOS WebView - deps/webview stays unpatched and the public export
      # surface stays at exactly 17.
      - name: CAP-7M1 compile the production Cocoa bridge (one object)
        shell: bash
        timeout-minutes: 10
        run: tools/build-macos-bridge.sh

      - name: CAP-7M0 compile the binding, mORMot core and the probe (M17)
        shell: bash
        timeout-minutes: 20
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/build_cap7m.sh

      # The full PWeb suite on Darwin, including the CAP-7M1 adapter cases and
      # - for the first time - TTestAssetStores, which could not even
      # construct here before FinalPathOfFd grew an fcntl(F_GETPATH) body.
      # Plus the real-symlink folder-confinement probe the Windows junction
      # fixture cannot express, run twice from two working directories.
      - name: CAP-7M1 headless gates (suite + folder confinement)
        shell: bash
        timeout-minutes: 20
        run: test/cap7m/run_cap7m_gates.sh

      # A REAL WKWebView on a real Aqua session. No mocked WebKit, no browser
      # substitute, no headless-DOM stand-in, no SKIP path.
      # Three cycles: one of each shutdown shape, plus a third so the M6 leak
      # bound has a baseline that is not the cache-populating first cycle.
      - name: CAP-7M0 feasibility probes (M6-M15)
        shell: bash
        timeout-minutes: 25
        # No --clean: fresh workspace (see the dylib build step).
        run: test/cap7m/run_cap7m_probes.sh 3

      # THE ACCEPTANCE CRITERION IN THE FLESH: a real WKWebView, the
      # production adapter, folder AND zip stores over one corpus, the frozen
      # scheduler/binding/mORMot path to 42, both shutdown shapes, and the
      # whole thing again from `/` with every DYLD_* hint stripped. No mocked
      # WebKit, no browser substitute, no SKIP path.
      - name: CAP-7M1 production runtime gates (real WKWebView, folder + zip)
        shell: bash
        timeout-minutes: 30
        run: test/cap7m/run_cap7m_runtime.sh 3

      # ------------------- CAP-7M2: release .app products -------------------
      # The frontends are built HERE, on this runner, from the same pinned
      # toolchains the Windows and Linux jobs use: Node 24.11.1 for the
      # TypeScript SDK and the React dist, Pas2JS 3.0.1 for the Pascal dist.
      # On this leg the pinned darwin x86_64 pas2js binary runs natively; the
      # arm64 sibling compiles the SAME pinned logical version from the
      # pinned FPC-repo revision because no aarch64 artifact exists upstream
      # and Rosetta is banned.
      - name: CAP-7M2 setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      - name: CAP-7M2 TypeScript SDK build + tests
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd sdk/typescript
          npm ci
          npm test
          cd ../..
          for f in sdk/typescript/dist/src/index.js \
                   sdk/typescript/dist/src/index.d.ts; do
            [ -f "${f}" ] || { echo "SDK build output missing: ${f}"; exit 1; }
          done

      - name: CAP-7M2 React frontend build (pinned lockfile, offline bundle)
        shell: bash
        timeout-minutes: 10
        run: |
          v="$(node --version)"
          [ "${v}" = 'v24.11.1' ] || { echo "expected node v24.11.1, got ${v}"; exit 1; }
          cd examples/04-react/frontend
          npm ci
          npm run typecheck
          npm run build
          cd ../../..
          for f in examples/04-react/frontend/dist/index.html \
                   examples/04-react/frontend/dist/assets/app.js; do
            [ -f "${f}" ] || { echo "react frontend output missing: ${f}"; exit 1; }
          done

      - name: CAP-7M2 fetch pinned pas2js (sha256 + native arch) and build its frontend
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File tools/get-pas2js.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pinned pas2js fetch FAILED' }
          pwsh -NoProfile -File examples/05-pas2js/frontend/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pas2js frontend build FAILED' }
          foreach ($f in 'examples/05-pas2js/frontend/dist/index.html',
                         'examples/05-pas2js/frontend/dist/assets/app.js') {
            if (-not (Test-Path $f)) { throw "pas2js frontend output missing: $f" }
          }

      - name: CAP-7M2 compile the release host and bundler
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/build_cap7m_release.sh

      - name: CAP-7M2 release .app gates - assembly, refusals, direct + LaunchServices to 42
        shell: bash
        timeout-minutes: 30
        run: test/cap7m/run_cap7m_release.sh

      # The R7 inputs for the cross-architecture compare job. ERROR, not
      # ignore: a release gate that passed while emitting no inventory is the
      # shape of a proof that proved nothing.
      - name: CAP-7M2 release manifests and inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap7m2-release-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            build/cap7m/release-apps/manifest-react.txt
            build/cap7m/release-apps/manifest-pas2js.txt
            build/cap7m/release-apps/inventory-react.txt
            build/cap7m/release-apps/inventory-pas2js.txt

      - name: CAP-7M0 bundle layout measured from an unrelated CWD (M18)
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/check_release_layout.sh

      - name: CAP-7M0 zero-transport proof (M20)
        shell: bash
        timeout-minutes: 15
        run: test/cap7m/check_cap7m_nonetwork.sh

      # ---------- CAP-8B: the real-window privileged-navigation matrix ----------
      # The production gate that replaced the Checkpoint-1 audit probe, on
      # WKWebView, natively on THIS architecture (a result measured on one
      # arch is not evidence about the other). Like Linux and unlike Windows,
      # the raw __webview__ message handler reaches native from every frame on
      # WebKit, so the matrix's child tripwire and the native CSP are
      # load-bearing. A real Aqua session is always present, so every failure
      # gates - no SKIP.
      - name: CAP-8B real-window navigation matrix (WKWebView)
        shell: bash
        timeout-minutes: 20
        run: test/cap8b/run_nav_matrix.sh

      - name: CAP-8B upload the macOS x64 nav-matrix record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8b-nav-matrix-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8b/nav-matrix.json
            build/cap8b/nav-matrix-posix.log

      # ---------- CAP-8C: the multi-principal integration harness ----------
      # The production gate that replaced the Checkpoint-1 topology probe, on
      # WKWebView, natively on THIS architecture (a result measured on one
      # arch is not evidence about the other). The headless NATIVE leg writes
      # the canonical security-corpus.txt; the GUI leg of two simultaneously
      # live WKWebView windows proves the shared policy differentiates two
      # real principals with the content-swap + injected-opener evidence,
      # under the R-C2/R-C3 lifecycle (no mid-loop destroy; terminate only the
      # run-owner at shutdown). A real Aqua session is always present, so
      # every failure gates - no SKIP. Runs BEFORE the CAP-7F emitter.
      - name: CAP-8C multi-principal integration harness (WKWebView)
        shell: bash
        timeout-minutes: 20
        run: test/cap8c/run_multiprincipal.sh

      - name: CAP-8C upload the macOS x64 multiprincipal record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap8c-multiprincipal-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap8c/multiprincipal-macos-x86_64.json
            build/cap8c/security-corpus.txt
            build/cap8c/multiprincipal-posix.log

      # CAP-9A: the QuickJS invocation-foundation harness. Fully headless.
      # The pinned mORMot release ships NO darwin quickjs.o and the pinned
      # defines never set LIBQUICKJSSTATIC on darwin, so the runner first
      # compiles the object from the PINNED in-tree sources
      # (tools/build_quickjs_darwin.sh - refuses a non-pinned checkout,
      # records source sha256 + clang + arch) and links it itself. The
      # paired C/Pascal ABI diff always runs (clang is native here). Runs
      # BEFORE the CAP-7F emitter, which reads its verdict into
      # quickjs_corpus (must-PASS) and hashes the corpus digest.
      - name: CAP-9A QuickJS invocation foundation harness
        shell: bash
        timeout-minutes: 20
        run: test/cap9a/run_quickjsfoundation.sh

      - name: CAP-9A upload the macOS x64 quickjs record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9a-quickjs-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9a/quickjsfoundation-macos-x86_64.json
            build/cap9a/quickjs-corpus.txt
            build/cap9a/abi-pascal.txt
            build/cap9a/abi-c.txt
            build/cap9a/qjs-obj/quickjs-build-info.txt
            build/cap9a/quickjsfoundation-posix.log

      # CAP-9B1: the QuickJS package + module-loader harness, over the same
      # CI-built pinned QuickJS object the CAP-9A step above produced. Fully
      # headless and fixture-free on disk, so the P1-P40 matrix and its
      # corpus digest are identical to the other three targets. Runs BEFORE
      # the CAP-7F emitter, which reads its verdict into
      # quickjs_package_corpus (must-PASS) and hashes quickjs_package_digest.
      - name: CAP-9B1 QuickJS package and module-loader harness
        shell: bash
        timeout-minutes: 20
        run: test/cap9b1/run_quickjspackage.sh

      - name: CAP-9B1 upload the macOS x64 package record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9b1-package-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9b1/quickjspackage-macos-x86_64.json
            build/cap9b1/quickjs-package-corpus.txt
            build/cap9b1/quickjspackage-posix.log

      # CAP-9B2: the QuickJS plugin lifecycle + transactional reload matrix,
      # over the same CI-built pinned QuickJS object. Fully headless, so its
      # L1-L40 decisions and corpus digest are identical to the other three
      # targets. Runs BEFORE the CAP-7F emitter, which reads its verdict into
      # quickjs_lifecycle_corpus (must-PASS) and hashes
      # quickjs_lifecycle_digest.
      - name: CAP-9B2 QuickJS plugin lifecycle and reload harness
        shell: bash
        timeout-minutes: 30
        run: test/cap9b2/run_quickjslifecycle.sh

      - name: CAP-9B2 upload the macOS x64 lifecycle record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9b2-lifecycle-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9b2/quickjslifecycle-macos-x86_64.json
            build/cap9b2/quickjs-lifecycle-corpus.txt
            build/cap9b2/quickjslifecycle-posix.log

      # CAP-9C1: see the x64 Linux sibling. The packager and the harness both
      # link the CI-built pinned QuickJS object the CAP-9A step produced.
      - name: CAP-9C1 QuickJS release package and trusted loader harness
        shell: bash
        timeout-minutes: 30
        run: test/cap9c1/run_quickjsrelease.sh

      - name: CAP-9C1 upload the macOS x64 release record and payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9c1-release-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9c1/quickjsrelease-macos-x86_64.json
            build/cap9c1/quickjs-release-corpus.txt
            build/cap9c1/quickjsrelease-posix.log
            build/cap9c1/pwebqjspack-posix.log
            build/quickjs-release/

      # CAP-9C2: see the Windows job for the rationale.
      - name: CAP-9C2 plugin-enabled acceptance frontend build
        shell: bash
        timeout-minutes: 10
        run: |
          cd examples/07-quickjs/frontend
          npm ci
          npm run typecheck
          npm run build
          cd ../../..
          for f in examples/07-quickjs/frontend/dist/index.html \
                   examples/07-quickjs/frontend/dist/assets/app.js; do
            [ -f "${f}" ] || { echo "quickjs frontend output missing: ${f}"; exit 1; }
          done

      # A real WKWebView inside a real PWebQuickJS.app bundle, driven
      # while two QuickJS plugin threads run beside it.
      - name: CAP-9C2 plugin-enabled release layout and real-GUI acceptance
        shell: bash
        timeout-minutes: 40
        run: test/cap9c2/run_quickjsgui.sh

      - name: CAP-9C2 upload the macOS x64 plugin-enabled record and layout
        # always(): a gate that fails while its diagnostics sit in a skipped
        # upload costs a whole hosted cycle to learn nothing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap9c2-gui-macos-x64
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/cap9c2/quickjsgui-macos-x86_64.json
            build/cap9c2/quickjs-gui-corpus.txt
            build/cap9c2/host-rows.txt
            build/cap9c2/hostile-rows.txt
            build/cap9c2/runner-rows.txt
            build/cap9c2/quickjsgui-posix.log

      # CAP-7F: additive, after every gate it summarizes. macOS runs no new
      # gate - the CAP-7M2 release suite above already executed the host
      # arguments (LaunchServices --pweb-verdict, argv-beats-env, refusal
      # verdicts) - so the emitter consumes measurements.txt, the release
      # manifests/inventories and the run logs, and re-enumerates the
      # export trie from the built dylib.
      # CAP-10A: the public pweb CLI (see the windows job for the rationale)
      # BUILD ORDER (see the windows job): `pweb` compiles the GENERATED
      # template registry in with -Fi, so it cannot be built before the pack
