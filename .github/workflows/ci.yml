        run: |
          pwsh -NoProfile -File test/cap10b0/build_cap10b0.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B0 build FAILED' }

      - name: CAP-10B1 build the public pack, the CLI and the SDK root
