      # CAP-10B2: the public Pas2JS scaffold (see the windows job for the
      # layering). The build proof opens a REAL WKWebView and drives the
      # generated Pas2JS application to 42, from a .app bundle because
      # WKWebView keys persistent state by bundle identifier.
      - name: CAP-10B2 build the react-only CLI that proves template_unknown
        shell: bash
        timeout-minutes: 15
        run: test/cap10b2/build_cap10b2.sh

      - name: CAP-10B2 contract cross-checks (two UIs, one native app, no npm)
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/cap10b2/check_cap10b2_contracts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 contract cross-checks FAILED' }

      - name: CAP-10B2 pas2js create gates + evidence
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap10b2/run_cap10b2_gates.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 create gates FAILED' }

      - name: CAP-10B2 private build proof and real GUI run
        shell: bash
        timeout-minutes: 30
        run: test/cap10b2/prove_cap10b2.sh

      - name: CAP-10B2 upload the pas2js corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
