# CAP-1 minimal Windows CI (phase-plan.md: starts at Phase 1, not Phase 11),
# extended by CAP-2, CAP-3 and CAP-4W: every CAP-1 gate is kept verbatim; CAP-2 adds the
# webview-free scheduler compile, the headless invocation-pipeline test cases
# inside pwebtests, and the JS-binding example compile (gating) with a
# best-effort non-gating run, mirroring the CAP-1 smoke policy. CAP-3 adds its
# real in-process mORMot bridge gates while the CAP-3U trampoline is prepared.
# CAP-4W adds the exact Windows dependency correction, unchanged-export proof,
# and custom-scheme probe compilation; its GUI run follows the existing
# best-effort hosted policy and never fabricates a runtime PASS.
# CAP-4 adds the asset system: isolation compiles of the Folder/ZIP stores
# and the Windows pweb://app resource handler, the headless Folder/ZIP
# parity cases inside pwebtests, a zero-HTTP source sweep over the new
# units, the deterministic app.zip build, and the dual-mode (folder|zip)
# runtime example under the same conditional hosted GUI policy.
# CAP-5 adds the frontend SDKs: TypeScript SDK typecheck + node:test suite
# and Pas2JS SDK compile + node-run semantic suite (both against a fake of
# the same native primitive), the captured-wire cross-SDK parity gate, the
# protocol-constant cross-check, pinned React and Pas2JS frontend builds
# (npm lockfiles; pas2js pinned by sha256 via tools/get-pas2js.ps1), a
# zero-network sweep over both SDKs and frontends, host-app compiles in a
# re-applied CAP-3U window, and both real-frontend runtime smokes under
# the same conditional hosted GUI policy. Every pre-existing step below is
# kept verbatim.
#
# Invariants honoured here:
# - The upstream fetch is the EXACT pinned SHA from webview.lock, checksum
#   cross-checked (tools/get-webview.ps1). No branch, tag, or floating ref of
#   webview/webview appears anywhere in this workflow, and a guard step scans
#   the fetch/build scripts and this file for floating-ref forms.
# - mORMot2 (test/app layer ONLY -- src/lib stays mORMot-free) is pinned the
#   same way: exact SHA + sha256-pinned statics archive in mormot.lock,
#   fetched by tools/get-mormot.ps1. The test suite pwebtests.pas runs on
#   mormot.core.test with /noenter.
# - Third-party actions are pinned to full commit SHAs (tag in comment).
# - ABI tests run at full strength: the C probe (pinned headers, MSVC) and
#   the Pascal probe (committed binding, FPC) must emit byte-identical
#   reports, and all 17 pinned entry points must be exported by a DLL built
#   from the pinned source.
# - Binding regeneration itself (chet-cli) is a LOCAL gate: ChetCLI is a
#   host-installed tool not redistributed in this repo; the committed
#   pipeline is tools/regen-webview-binding.ps1. CI instead proves the
#   committed binding against the pinned headers (probe diff + signature-pin
#   compile + symbol coverage + surface check), which fails on any drift a
#   regeneration would reveal.
# - The GUI smoke RUN is a documented human/local gate; CI compiles it and
#   attempts an auto-closing run without letting an absent desktop session
#   fail the build, recording the outcome in the step summary.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # 30 sufficed through CAP-6b1; CAP-6b2 added the bounded ~210 MB
    # standalone fetch + the offline setup build/gates, and CAP-6b3
    # adds the bounded ~290 MB Fixed Version Runtime fetch, its ~690 MB
    # expansion, TWO setup compiles over that tree (the real one plus
    # the abort probe) and install/uninstall gates over ~690 MB.
    # The rule this number follows: every step budget must exceed the
    # sum of the bounded waits the step's own script can spend, and
    # this job budget must exceed the sum of every declared step
    # budget. Those now total 283 minutes (143 pre-existing + 20 fetch
    # + 45 build + 75 gates for CAP-6b3), so the job gets 300 - still
    # inside the 360-minute hosted-runner ceiling. These are CEILINGS
    # that only ever fire on a hang: a healthy run is a small fraction
    # of them (the CAP-6b3 setup compiles in ~25 s locally).
    timeout-minutes: 300
    steps:
      - name: Checkout (full history for freeze diff against baseline)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pinned webview/webview (exact SHA, checksum verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-webview.ps1

      - name: CAP-4W - exact Windows patch apply, restore and reapply
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/patch-cap4w-webview.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4W first patch apply failed' }
          pwsh -NoProfile -File tools/patch-cap4w-webview.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4W idempotent apply failed' }
          pwsh -NoProfile -File tools/patch-cap4w-webview.ps1 -Restore
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4W restore failed' }
          if (git -C deps/webview status --porcelain) {
            throw 'CAP-4W restore left dependency changes'
          }
          pwsh -NoProfile -File tools/patch-cap4w-webview.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4W final patch apply failed' }
          $sentinel = 'deps/webview/cap4w-unknown-state-ci.tmp'
          try {
            New-Item -ItemType File -Path $sentinel -ErrorAction Stop | Out-Null
            $unknown = & pwsh -NoProfile -File `
              tools/patch-cap4w-webview.ps1 2>&1 | Out-String
            $unknownCode = $LASTEXITCODE
            Write-Host $unknown
            if (($unknownCode -eq 0) -or
                ($unknown -notmatch 'dependency has unknown changes')) {
              throw 'CAP-4W patcher did not reject unknown dependency state'
            }
          }
          finally {
            if (Test-Path -LiteralPath $sentinel) {
              Remove-Item -LiteralPath $sentinel -Force
            }
          }
          pwsh -NoProfile -File tools/patch-cap4w-webview.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4W exact state lost after rejection test' }

      - name: Fetch pinned mORMot2 (exact SHA + sha256-pinned statics)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-mormot.ps1

      - name: Guard - no floating upstream ref in fetch/build path
        shell: pwsh
        run: |
          # Any git form that could follow a moving ref is a violation in the
          # scripts that touch upstream, and in this workflow itself.
          # (Patterns are concatenated so they cannot literally match their
          # own source in this file.)
          $pat = 'git\s+(cl' + 'one|pu' + 'll|ls-rem' + 'ote)' +
                 '|refs/(he' + 'ads|ta' + 'gs)' +
                 '|fetch[^\r\n]*origin[^\r\n]*\b(mas' + 'ter|HE' + 'AD|ma' + 'in)\b' +
                 '|webview/web' + 'view@'
          $files = 'tools/get-webview.ps1', 'tools/get-mormot.ps1',
                   'tools/build-webview-dll.ps1',
                   'tools/patch-cap4w-webview.ps1',
                   '.github/workflows/ci.yml'
          $bad = @()
          foreach ($f in $files) {
            $hit = Select-String -Path $f -Pattern $pat
            if ($hit) { $bad += "${f}: $($hit[0].Line.Trim())" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "VIOLATION: $_" }; throw 'floating upstream ref detected' }
          foreach ($lf in 'webview.lock', 'mormot.lock') {
            $lock = Get-Content $lf -Raw
            if ($lock -notmatch 'commit\s*=\s*[0-9a-f]{40}') {
              throw "$lf does not pin a full 40-char SHA"
            }
          }
          Write-Host 'guard: no floating upstream ref'

      - name: Install FPC (Lazarus 3.4 ships FPC 3.2.2)
        uses: gcarreno/setup-lazarus@d633fa79b45e29794ab46ec31f7543e44e02efef # v3
        with:
          lazarus-version: "3.4"

      - name: Assert FPC 3.2.2
        shell: pwsh
        run: |
          $v = (fpc -iV).Trim()
          Write-Host "fpc version: $v"
          if ($v -ne '3.2.2') { throw "expected FPC 3.2.2, got $v" }

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: CAP-3U - FPC 3.2.2 Win64 CallMethod unwind and Currency ABI
        shell: pwsh
        run: |
          # FPC 3.2.2 Win64 emits no unwind metadata for mORMot's private
          # CallMethod assembler and returns Currency in RAX, unlike its
          # Double/TDateTime XMM0 convention. Exercise the exact pinned fix
          # before any mORMot PPU can mask the conditional replacement.
          $stale = @(Get-ChildItem -Path . -Recurse `
            -Filter mormot.core.interfaces.ppu -File -ErrorAction SilentlyContinue)
          if ($stale) {
            throw "stale mormot.core.interfaces.ppu before CAP-3U: $($stale.FullName -join '; ')"
          }
          $targetOs = (fpc -iTO).Trim().ToLowerInvariant()
          $targetCpu = (fpc -iTP).Trim().ToLowerInvariant()
          if (($targetOs -cne 'win64') -or ($targetCpu -cne 'x86_64')) {
            throw "CAP-3U requires FPC target Win64/x86_64, got $targetOs/$targetCpu"
          }
          try {
            foreach ($attempt in 1..2) {
              pwsh -NoProfile -File tools/patch-cap3u.ps1
              if ($LASTEXITCODE -ne 0) {
                throw "CAP-3U preparation attempt $attempt failed"
              }
            }

            New-Item -ItemType Directory -Force build/cap3u/fpc,
              build/cap3u/bin | Out-Null
            fpc -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap3u/fpc -FEbuild/cap3u/bin `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              test/cap3u/cap3u_unwind.pas 2>&1 |
              Tee-Object build/cap3u/compile.log
            if ($LASTEXITCODE -ne 0) { throw 'CAP-3U compile failed' }

            $compile = Get-Content build/cap3u/compile.log -Raw
            if ($compile -notmatch
                'Compiling .*deps[\\/]mormot2[\\/]src[\\/]core[\\/]mormot\.core\.interfaces\.pas') {
              throw 'CAP-3U unit provenance did not compile repository mormot.core.interfaces'
            }
            $ppus = @(Get-ChildItem -Path . -Recurse `
              -Filter mormot.core.interfaces.ppu -File)
            $expectedPpu = (Resolve-Path `
              build/cap3u/fpc/mormot.core.interfaces.ppu).Path
            if (($ppus.Count -ne 1) -or ($ppus[0].FullName -cne $expectedPpu)) {
              throw "CAP-3U unit provenance escaped dedicated -FU: $($ppus.FullName -join '; ')"
            }

            $binaryLines = @(pwsh -NoProfile -File `
              test/cap3u/check_unwind.ps1 `
                -ObjectPath deps/mormot2/src/core/x64callmethod.obj `
                -ExecutablePath build/cap3u/bin/cap3u_unwind.exe `
                -MapPath build/cap3u/bin/cap3u_unwind.map 2>&1)
            $binaryCode = $LASTEXITCODE
            $binaryLines | Tee-Object -FilePath build/cap3u/binary.log |
              Write-Host
            if ($binaryCode -ne 0) { throw 'CAP-3U final-PE unwind gate failed' }

            $runtimeLines = @(& build/cap3u/bin/cap3u_unwind.exe 2>&1)
            $runtimeCode = $LASTEXITCODE
            $runtimeLines | Tee-Object -FilePath build/cap3u/runtime.log |
              Write-Host
            if (($runtimeCode -ne 0) -or
                (($runtimeLines -join "`n") -notmatch 'CAP3U: 12/12 PASS')) {
              throw 'CAP-3U runtime matrix failed'
            }

            # CAP-3 must compile only after CAP-3U prepared the source and in
            # fresh output directories, so no stale mormot.core.interfaces PPU
            # can mask the required conditional trampoline.
            if (Test-Path build/cap3) {
              Remove-Item -LiteralPath build/cap3 -Recurse -Force
            }
            New-Item -ItemType Directory -Force build/cap3/bridge-fpc,
              build/cap3/test-fpc, build/cap3/bin,
              build/cap3/example-fpc, build/cap3/example | Out-Null

            # Production bridge layering proof: no src/lib or src/webview path.
            fpc -MObjFPC -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap3/bridge-fpc -Fusrc/rpc `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              src/rpc/pweb.rpc.mormot.pas
            if ($LASTEXITCODE -ne 0) {
              throw 'CAP-3 production bridge compile failed'
            }

            # Mandatory WebView-free headless gate over the real Uri() path.
            fpc -MObjFPC -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap3/test-fpc -FEbuild/cap3/bin `
              -Fusrc/rpc -Fusrc/security -Futest/rpc `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              test/rpc/cap3tests.pas
            if ($LASTEXITCODE -ne 0) { throw 'CAP-3 headless compile failed' }
            & build/cap3/bin/cap3tests.exe /noenter
            if ($LASTEXITCODE -ne 0) { throw 'CAP-3 headless suite FAILED' }

            # Compile the real JS -> scheduler -> mORMot runtime proof while
            # the same prepared trampoline is active. Its best-effort GUI run
            # occurs after webview.dll has been built and staged below.
            fpc -MObjFPC -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap3/example-fpc -FEbuild/cap3/example `
              -Fusrc/lib -Fusrc/rpc -Fusrc/security -Fusrc/webview `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              examples/03-mormot-rpc/mormotrpc.pas
            if ($LASTEXITCODE -ne 0) { throw 'CAP-3 runtime example compile failed' }

            # CAP-4 dual-mode runtime example: it reuses the real CAP-3
            # bridge, so it compiles inside the same prepared trampoline
            # window. Its best-effort GUI runs happen after webview.dll is
            # staged below.
            if (Test-Path build/cap4) {
              Remove-Item -LiteralPath build/cap4 -Recurse -Force
            }
            New-Item -ItemType Directory -Force build/cap4/example-fpc,
              build/cap4/tool-fpc, build/cap4/example | Out-Null
            fpc -MObjFPC -Sh -B -Xm -dPWEB_CALLMETHOD_UNWIND_PROBE `
              -FUbuild/cap4/example-fpc -FEbuild/cap4/example `
              -Fusrc/lib -Fusrc/rpc -Fusrc/security -Fusrc/webview `
              -Fusrc/assets -Fusrc/platform/windows `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib -Fudeps/mormot2/src/crypt `
              -Fudeps/mormot2/src/net -Fudeps/mormot2/src/db `
              -Fudeps/mormot2/src/orm -Fudeps/mormot2/src/rest `
              -Fudeps/mormot2/src/soa `
              -Fldeps/mormot2/static/x86_64-win64 `
              examples/06-assets/assetsapp.pas
            if ($LASTEXITCODE -ne 0) { throw 'CAP-4 runtime example compile failed' }
            fpc -MObjFPC -Sh -B -Xm `
              -FUbuild/cap4/tool-fpc -FEbuild/cap4/example `
              -Fideps/mormot2/src -Fudeps/mormot2/src/core `
              -Fudeps/mormot2/src/lib `
              -Fldeps/mormot2/static/x86_64-win64 `
              examples/06-assets/mkappzip.pas
            if ($LASTEXITCODE -ne 0) { throw 'CAP-4 mkappzip compile failed' }

            # Source-level proof that CAP-3 introduced no HTTP client/server,
            # socket, loopback listener, or localhost transport. TRestServer
            # itself is intentionally allowed because Uri() is called directly.
            $cap3Files = @(
              'src/rpc/pweb.rpc.mormot.pas',
              'test/rpc/cap3tests.pas',
              'test/rpc/pweb.test.mormot.bridge.pas',
              'test/rpc/pweb.test.mormot.fixture.pas',
              'test/rpc/pweb.test.mormot.integration.pas',
              'test/rpc/pweb.test.mormot.routing.pas',
              'examples/03-mormot-rpc/mormotrpc.pas'
            )
            $networkPattern = 'TRestHttpServer|TRestClientHttp|THttpServer|' +
              'mormot\.rest\.http|mormot\.net\.(server|client|http)|' +
              'localhost|127\.0\.0\.1|socket'
            $networkHits = @(Select-String -Path $cap3Files `
              -Pattern $networkPattern -CaseSensitive:$false)
            if ($networkHits) {
              $networkHits | ForEach-Object {
                Write-Host "FORBIDDEN CAP-3 NETWORK PATTERN: $($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              }
              throw 'CAP-3 zero-network source proof failed'
            }
            Write-Host 'CAP-3 zero-network source proof: PASS'
          }
          finally {
            $restoreFailures = @()
            foreach ($attempt in 1..2) {
              pwsh -NoProfile -File tools/patch-cap3u.ps1 -Restore
              if ($LASTEXITCODE -ne 0) { $restoreFailures += $attempt }
            }
            if ($restoreFailures) {
              throw "CAP-3U restore attempts failed: $($restoreFailures -join ', ')"
            }
          }
          $lockedCommit = ((Select-String -Path mormot.lock `
            -Pattern '^commit\s*=').Line -split '=', 2)[1].Trim()
          $dependencyHead = (git -C deps/mormot2 rev-parse HEAD).Trim()
          if (($LASTEXITCODE -ne 0) -or ($dependencyHead -cne $lockedCommit)) {
            throw "mORMot HEAD $dependencyHead differs from lock $lockedCommit"
          }
          git -C deps/mormot2 diff --exit-code `
            $dependencyHead -- `
            src/core/mormot.core.interfaces.pas
          if ($LASTEXITCODE -ne 0) { throw 'CAP-3U source is not pristine after restore' }
          if (Test-Path deps/mormot2/src/core/x64callmethod.obj) {
            throw 'CAP-3U object survived restore'
          }

      - name: Build webview.dll from pinned source (cmake + MSVC)
        shell: pwsh
        run: pwsh -NoProfile -File tools/build-webview-dll.ps1

      - name: CAP-4W - public DLL ABI remains exactly 17 exports
        shell: pwsh
        run: pwsh -NoProfile -File test/cap4w/check_webview_exports.ps1

      - name: CAP-4W - headless loader boundary and compile resource probe
        shell: pwsh
        run: pwsh -NoProfile -File test/cap4w/check_cap4w.ps1 -CompileOnly

      - name: CAP-4W - custom-scheme runtime (best effort, local gate authoritative)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = & pwsh -NoProfile -File test/cap4w/check_cap4w.ps1 `
            -Cycles 3 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if (($code -eq 0) -and
              ($out -match 'CAP4W_RENDERED_PASS cycles=3')) {
            $verdict = 'PASS - pweb://app HTML/JS rendered for three clean cycles'
          }
          elseif (($out -match 'CAP4W_FAIL cycle=1 operation=webview_create') -and
                  ($out -notmatch 'CAP4W_CYCLE_PASS')) {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code or missing rendered marker"
          }
          "### CAP-4W custom-scheme runtime (conditional hosted gate)`n$verdict" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "CAP-4W hosted verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      - name: Compile binding units (FPC, ObjFPC mode)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fpc | Out-Null
          fpc -MObjFPC -Sh -B -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.pas
          if ($LASTEXITCODE -ne 0) { throw 'core unit failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.types.pas
          if ($LASTEXITCODE -ne 0) { throw 'types unit failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib src/lib/pweb.lib.webview.errors.pas
          if ($LASTEXITCODE -ne 0) { throw 'errors unit failed' }

      # CAP-2: the scheduler MUST compile with no src/webview unit path and
      # no mORMot path - proving it is source-generic and RTL-only, per the
      # frozen "defined over invocation sources" rule. The other new units
      # compile with exactly the dependencies the layering allows them.
      - name: Compile CAP-2 units (scheduler proven webview-free)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fpc-rpc, build/fpc-cap2 | Out-Null
          # the neutral support unit must stay RTL-only over pweb.rpc.intf
          # alone: compiled with -Fusrc/rpc ONLY so any webview/mORMot/
          # platform dependency creeping in fails this gate
          fpc -MObjFPC -Sh -B -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.support.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.support.pas failed its RTL-only intf-only compile' }
          fpc -MObjFPC -Sh -B -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.scheduler.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.scheduler.pas failed its webview-free RTL-only compile' }
          fpc -MObjFPC -Sh -FUbuild/fpc-rpc -Fusrc/rpc src/rpc/pweb.rpc.bridge.dummy.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.bridge.dummy.pas failed' }
          fpc -MObjFPC -Sh -FUbuild/fpc-rpc -Fusrc/rpc -Fusrc/security src/security/pweb.capabilities.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.capabilities.pas failed' }
          # the binding may use pinned mORMot2 core units (project include
          # pattern); src/lib alone stays mORMot-free
          fpc -Sh -B -FUbuild/fpc-cap2 -Fusrc/lib -Fusrc/rpc -Fusrc/webview `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/webview/pweb.webview.binding.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.webview.binding.pas failed' }

      # CAP-4 layering proofs. The stores compile with src/assets alone plus
      # the pinned mORMot core - any webview/rpc/platform dependency creeping
      # into IAssetStore implementations fails here. The Windows handler adds
      # only src/lib (raw ABI seam) on top of the stores - it must never pull
      # the rpc scheduler or the CAP-2 binding into the resource path.
      - name: Compile CAP-4 asset units (stores webview-free, handler rpc-free)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/fpc-assets | Out-Null
          fpc -MObjFPC -Sh -B -FUbuild/fpc-assets -Fusrc/assets `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/assets/pweb.assets.support.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.assets.support.pas failed its isolation compile' }
          fpc -MObjFPC -Sh -FUbuild/fpc-assets -Fusrc/assets `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/assets/pweb.assets.folder.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.assets.folder.pas failed its isolation compile' }
          fpc -MObjFPC -Sh -FUbuild/fpc-assets -Fusrc/assets `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/assets/pweb.assets.zip.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.assets.zip.pas failed its isolation compile' }
          fpc -MObjFPC -Sh -FUbuild/fpc-assets -Fusrc/assets -Fusrc/lib `
            -Fusrc/platform/windows `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/platform/windows/pweb.platform.webview2.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.platform.webview2.pas failed its isolation compile' }

      # Source-level proof that CAP-4 serves assets with no HTTP, localhost,
      # socket, or file:// transport anywhere in its units, tests, example,
      # or frontend fixture.
      - name: CAP-4 zero-HTTP asset-serving source proof
        shell: pwsh
        run: |
          $cap4Files = @(
            'src/assets/pweb.assets.support.pas',
            'src/assets/pweb.assets.folder.pas',
            'src/assets/pweb.assets.zip.pas',
            'src/platform/windows/pweb.platform.webview2.pas',
            'src/platform/windows/pweb.platform.webview2.runtime.pas',
            'src/platform/windows/pweb.platform.webview2.provision.pas',
            'test/platform/pweb.test.webview2runtime.pas',
            'test/platform/pweb.test.wv2provision.pas',
            'tools/setup/pwebwv2prov.pas',
            'test/cap6b/wv2probe.pas',
            'test/assets/pweb.test.assets.pas',
            'examples/06-assets/assetsapp.pas',
            'examples/06-assets/mkappzip.pas',
            'examples/06-assets/frontend/dist/index.html',
            'examples/06-assets/frontend/dist/assets/app.js',
            'examples/06-assets/frontend/dist/assets/app.css'
          )
          $forbidden = 'TRestHttpServer|THttpServer|mormot\.rest\.http|' +
            'mormot\.net\.(server|client|http)|localhost|127\.0\.0\.1|' +
            'socket|http://|file://'
          $hits = @(Select-String -Path $cap4Files -Pattern $forbidden `
            -CaseSensitive:$false)
          if ($hits) {
            $hits | ForEach-Object {
              Write-Host "FORBIDDEN CAP-4 TRANSPORT PATTERN: $($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            throw 'CAP-4 zero-HTTP source proof failed'
          }
          Write-Host 'CAP-4 zero-HTTP source proof: PASS'

      - name: Signature pin (compile-only gate over all 17 prototypes)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test | Out-Null
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fideps/mormot2/src -FEbuild/test test/core/signature_pin.pas
          if ($LASTEXITCODE -ne 0) { throw 'signature pin failed: binding signatures drifted' }

      - name: ABI probe - Pascal side (committed binding)
        shell: pwsh
        run: |
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fideps/mormot2/src -FEbuild/test test/core/abi_probe.pas
          if ($LASTEXITCODE -ne 0) { throw 'pascal probe compile failed' }
          & build/test/abi_probe.exe > build/test/abi_pascal.txt
          if ($LASTEXITCODE -ne 0) { throw "pascal probe exited $LASTEXITCODE" }
          Get-Content build/test/abi_pascal.txt

      - name: ABI probe - C side (pinned headers, MSVC)
        shell: cmd
        run: |
          cl /nologo /W4 /WX /Ideps\webview\core\include test\core\abi_probe.c /Fobuild\test\ /Febuild\test\abi_probe_c.exe
          if errorlevel 1 exit /b 1
          build\test\abi_probe_c.exe > build\test\abi_c.txt
          if errorlevel 1 exit /b 1
          type build\test\abi_c.txt

      - name: ABI probe - compare (any diff is a blocker)
        shell: pwsh
        run: |
          # Strict, order-sensitive, line-by-line comparison; a suspiciously
          # small fact count (e.g. empty-vs-empty) is itself a failure.
          $c = @(Get-Content build/test/abi_c.txt)
          $p = @(Get-Content build/test/abi_pascal.txt)
          if ($c.Count -lt 30) { throw "C probe emitted only $($c.Count) facts -- expected >= 30" }
          if ($c.Count -ne $p.Count) { throw "ABI probe mismatch: $($c.Count) vs $($p.Count) lines" }
          $bad = 0
          for ($i = 0; $i -lt $c.Count; $i++) {
            if ($c[$i] -cne $p[$i]) { Write-Host "MISMATCH line $($i+1): C='$($c[$i])' Pas='$($p[$i])'"; $bad++ }
          }
          if ($bad) { throw "ABI probe mismatch: $bad line(s)" }
          Write-Host "ABI probes identical: $($c.Count) facts"

      # mormot.core.test suite: CAP-1 (error helpers + 17/17 symbol coverage)
      # plus the twenty CAP-2 invocation-pipeline cases, all headless (the
      # binding cases run against injected fake native functions - no window;
      # the DLL is staged only because the binding unit's production defaults
      # import it at load time). /noenter skips the interactive ENTER wait;
      # the suite sets a nonzero exit code on any failed assertion.
      - name: PWeb test suite (mormot.core.test)
        shell: pwsh
        run: |
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fusrc/rpc -Fusrc/security `
            -Fusrc/webview -Fusrc/assets -Fusrc/platform/windows `
            -Futest/core -Futest/rpc `
            -Futest/assets -Futest/platform -Fideps/mormot2/src `
            -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt -Fudeps/mormot2/src/net `
            -FEbuild/test test/core/pwebtests.pas
          if ($LASTEXITCODE -ne 0) { throw 'pwebtests compile failed' }
          Copy-Item build/webview-dist/webview.dll build/test/
          $env:PWEB_WEBVIEW_DLL = (Resolve-Path build/webview-dist/webview.dll).Path
          & build/test/pwebtests.exe /noenter
          if ($LASTEXITCODE -ne 0) { throw 'pwebtests suite FAILED' }

      - name: Binding surface + freeze-isolation sweeps
        shell: pwsh
        run: pwsh -NoProfile -File test/core/check_binding_surface.ps1

      - name: Freeze sweep - RTL-only compile of isolation-critical intf units
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/freeze | Out-Null
          # pweb.rpc.intf.pas must compile with the bare RTL: proves no
          # webview/platform unit crept into the scheduler contract.
          fpc -MObjFPC -Sh -B -FUbuild/freeze src/rpc/pweb.rpc.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.rpc.intf.pas is not RTL-only' }
          fpc -MObjFPC -Sh -B -FUbuild/freeze src/webview/pweb.webview.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'pweb.webview.intf.pas failed RTL-only compile' }

      - name: Freeze sweep - frozen contracts byte-identical to Phase-0 baseline
        shell: pwsh
        run: |
          git diff --exit-code b2f04dc4c478c72b1699a954dd52e76b207e918b -- `
            src/rpc/pweb.rpc.intf.pas `
            src/webview/pweb.webview.intf.pas `
            src/assets/pweb.assets.intf.pas
          if ($LASTEXITCODE -ne 0) { throw 'frozen Phase-0 contract units were modified' }

      - name: Freeze sweep - raw ABI layer byte-identical to CAP-1 baseline
        shell: pwsh
        run: |
          # src/lib is regenerated only via the committed pipeline on a
          # ratified pin bump - never edited during a feature phase.
          git diff --exit-code 709bf0fee715d0cf9b8c475b4f801947fc0f4a65 -- src/lib
          if ($LASTEXITCODE -ne 0) { throw 'src/lib (raw ABI layer) was modified without a ratified pin bump' }

      - name: CAP-3 freeze sweep - Phase-0/1/2 implementation boundaries
        shell: pwsh
        run: |
          git diff --exit-code 4653ba77ef03f0a37b0b0b0c4205ed6ecfe7e0f5 -- `
            src/rpc/pweb.rpc.intf.pas `
            src/webview/pweb.webview.intf.pas `
            src/assets/pweb.assets.intf.pas `
            src/lib `
            src/rpc/pweb.rpc.scheduler.pas `
            src/rpc/pweb.rpc.bridge.dummy.pas `
            src/security/pweb.capabilities.pas `
            src/webview/pweb.webview.binding.pas
          if ($LASTEXITCODE -ne 0) {
            throw 'frozen Phase-0/1/2 implementation boundary was modified'
          }

      - name: Compile smoke example and stage its DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/example | Out-Null
          fpc -MObjFPC -Sh -FUbuild/fpc -Fusrc/lib -FEbuild/example examples/01-hello/hello.pas
          if ($LASTEXITCODE -ne 0) { throw 'smoke example failed to compile' }
          Copy-Item build/webview-dist/webview.dll build/example/

      # The real smoke RUN (window visible, marker rendered, clean exit) is a
      # documented human/local gate; this best-effort attempt runs it with
      # auto-close where the runner image has WebView2 + a desktop session.
      # Outcome is recorded in the step summary; a SKIP (no usable
      # session/runtime -> webview_create returns nil) is distinguished from
      # a genuine failure. Non-gating per spec.
      - name: Smoke run (best effort - authoritative gate is local)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $out = & build/example/hello.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            $verdict = 'PASS - window ran and exited cleanly'
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code (see log)"
          }
          "### Smoke run (non-gating)`n$verdict" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "smoke verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      - name: Compile JS-binding example (CAP-2) and stage its DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/example2 | Out-Null
          fpc -Sh -FUbuild/fpc -Fusrc/lib -Fusrc/rpc -Fusrc/security `
            -Fusrc/webview -Fideps/mormot2/src `
            -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt -Fudeps/mormot2/src/net `
            -FEbuild/example2 examples/02-js-binding/jsbinding.pas
          if ($LASTEXITCODE -ne 0) { throw 'JS-binding example failed to compile' }
          Copy-Item build/webview-dist/webview.dll build/example2/

      # Same policy as the CAP-1 smoke: the authoritative RUN (window visible,
      # concurrent JS invocations resolving) is a documented human/local gate;
      # CI attempts an auto-closing run without letting an absent desktop
      # session fail the build. Non-gating per spec.
      - name: JS-binding example run (best effort - authoritative gate is local)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $out = & build/example2/jsbinding.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            $verdict = 'PASS - JS binding example ran and exited cleanly'
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code (see log)"
          }
          "### JS-binding example run (non-gating)`n$verdict" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "jsbinding verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      - name: Stage CAP-3 runtime DLL
        shell: pwsh
        run: Copy-Item build/webview-dist/webview.dll build/cap3/example/

      # The executable was compiled while CAP-3U was prepared. As with the
      # earlier GUI examples, CI records an absent desktop/runtime as SKIP;
      # the visible local run is the authoritative smoke gate.
      - name: mORMot RPC example run (best effort - authoritative gate is local)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $env:PWEB_WEBVIEW_DLL = (Resolve-Path build/webview-dist/webview.dll).Path
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $out = & build/cap3/example/mormotrpc.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if (($code -eq 0) -and
              ($out -match 'CalculatorService\.Add -> 42 on scheduler worker PASS')) {
            $verdict = 'PASS - JS -> scheduler -> in-process mORMot -> JS returned 42 on a worker'
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - exit $code or missing CAP-3 PASS marker (see log)"
          }
          "### mORMot RPC example run (non-gating)`n$verdict" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "mormotrpc verdict: $verdict"
          if ($verdict.StartsWith('FAIL')) { exit 1 }

      # CAP-4: deterministic test package built headlessly from the committed
      # frontend fixture. This is gating - no GUI involved.
      - name: CAP-4 build app.zip from frontend fixture
        shell: pwsh
        run: |
          & build/cap4/example/mkappzip.exe examples/06-assets/frontend/dist `
            build/cap4/example/app.zip
          if ($LASTEXITCODE -ne 0) { throw 'CAP-4 app.zip build failed' }
          if (-not (Test-Path build/cap4/example/app.zip)) {
            throw 'CAP-4 app.zip missing after build'
          }

      # CAP-4 runtime gate, same conditional hosted policy as CAP-4W: the
      # same real frontend must load over pweb://app from BOTH stores with
      # HTML/CSS/JS/secure-context PASS and the CAP-3 RPC still returning
      # 42. A genuine failure gates; only an absent WebView2/desktop session
      # (webview_create nil) records SKIP. Local runs stay authoritative.
      - name: CAP-4 dual-mode runtime (best effort, local gate authoritative)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Copy-Item build/webview-dist/webview.dll build/cap4/example/
          $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
          $marker = 'via IAssetStore PASS'
          $failed = $false
          foreach ($mode in @('folder', 'zip')) {
            if ($mode -eq 'folder') {
              $target = 'examples/06-assets/frontend/dist'
            }
            else {
              $target = 'build/cap4/example/app.zip'
            }
            $out = & build/cap4/example/assetsapp.exe $mode $target 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if (($code -eq 0) -and ($out -match [regex]::Escape($marker))) {
              $verdict = "PASS - $mode mode served HTML/CSS/JS, secure context, RPC 42"
            }
            elseif ($out -match 'webview_create \(returned nil') {
              $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
            }
            else {
              $verdict = "FAIL - $mode mode exit $code or missing CAP-4 PASS marker (see log)"
              $failed = $true
            }
            "### CAP-4 runtime, $mode mode (conditional hosted gate)`n$verdict" |
              Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Host "assetsapp[$mode] verdict: $verdict"
          }
          if ($failed) { exit 1 }

      # ------------------------- CAP-5 gates -------------------------
      # Everything below is additive; no earlier step is altered.

      - name: CAP-5 fetch pinned pas2js (sha256-verified)
        shell: pwsh
        run: pwsh -NoProfile -File tools/get-pas2js.ps1

      - name: CAP-5 setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      - name: CAP-5 TypeScript SDK typecheck + tests + wire capture
        shell: pwsh
        run: |
          $v = (node --version).Trim()
          if ($v -ne 'v24.11.1') { throw "expected node v24.11.1, got $v" }
          New-Item -ItemType Directory -Force build/cap5 | Out-Null
          Push-Location sdk/typescript
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'SDK npm ci failed' }
            npm test
            if ($LASTEXITCODE -ne 0) { throw 'TypeScript SDK tests FAILED' }
            npm run capture 2>&1 |
              Out-File -Encoding utf8 ../../build/cap5/ts-capture.log
            if ($LASTEXITCODE -ne 0) { throw 'TypeScript SDK capture failed' }
          }
          finally { Pop-Location }

      - name: CAP-5 Pas2JS SDK compile + semantic tests + wire capture
        shell: pwsh
        run: |
          & deps/pas2js/bin/pas2js.exe -Tnodejs -Jc -O1 `
            '-Fusdk/pas2js' sdk/pas2js/test/pwebsdktests.pas
          if ($LASTEXITCODE -ne 0) { throw 'Pas2JS SDK harness compile failed' }
          $out = & node sdk/pas2js/test/pwebsdktests.js 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $out | Out-File -Encoding utf8 build/cap5/p2j-capture.log
          if (($code -ne 0) -or ($out -notmatch 'PWEBSDK: (\d+)/\1 PASS')) {
            throw 'Pas2JS SDK semantic suite FAILED'
          }

      - name: CAP-5 cross-SDK captured-wire parity
        shell: pwsh
        run: |
          node tools/check-sdk-parity.mjs `
            build/cap5/ts-capture.log build/cap5/p2j-capture.log
          if ($LASTEXITCODE -ne 0) { throw 'SDK wire parity FAILED' }

      - name: CAP-5 protocol constant cross-check (native vs both SDKs)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap5/check_cap5_protocol.ps1

      - name: CAP-5 React frontend build (pinned lockfile, offline bundle)
        shell: pwsh
        run: |
          Push-Location examples/04-react/frontend
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'react frontend npm ci failed' }
            npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'react frontend typecheck failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'react frontend build failed' }
          }
          finally { Pop-Location }
          foreach ($f in 'examples/04-react/frontend/dist/index.html',
                         'examples/04-react/frontend/dist/assets/app.js') {
            if (-not (Test-Path $f)) { throw "react frontend output missing: $f" }
          }

      - name: CAP-5 Pas2JS frontend build (pinned toolchain)
        shell: pwsh
        run: |
          pwsh -NoProfile -File examples/05-pas2js/frontend/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pas2js frontend build failed' }
          foreach ($f in 'examples/05-pas2js/frontend/dist/index.html',
                         'examples/05-pas2js/frontend/dist/assets/app.js') {
            if (-not (Test-Path $f)) { throw "pas2js frontend output missing: $f" }
          }

      # Zero-network sweep, host compiles (re-applied CAP-3U window) and
      # both real-frontend runtime smokes live in test/cap5/*.ps1; the
      # smokes follow the established conditional hosted PASS/SKIP/FAIL
      # policy - a genuine failure gates, only an absent WebView2/desktop
      # session records SKIP, local runs stay authoritative.
      - name: CAP-5 zero-network sweep over SDKs and frontends
        shell: pwsh
        run: pwsh -NoProfile -File test/cap5/check_cap5_nonetwork.ps1

      - name: CAP-5 host examples compile (re-applied CAP-3U window)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap5/build_cap5_hosts.ps1

      - name: CAP-5 runtime smokes - React and Pas2JS over pweb://app
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File test/cap5/run_cap5_smokes.ps1

      - name: CAP-5 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap5-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap5/ts-capture.log
            build/cap5/p2j-capture.log
            build/cap5/smoke-react.log
            build/cap5/smoke-pas2js.log

      # ------------------------- CAP-6 gates -------------------------
      # Everything below is additive; no earlier step is altered. The
      # CAP-6 headless test cases (pweb.test.bundle) already ran inside
      # the PWeb test suite step above - the suite registers them via
      # test/core/pwebtests.pas. The React dist consumed here was built
      # by the CAP-5 React frontend build step.

      - name: CAP-6 compile bundler + release host (CAP-3U window)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap6/build_cap6.ps1

      - name: CAP-6 headless gates - bundle, determinism, release layout, refusals
        shell: pwsh
        timeout-minutes: 10
        run: |
          pwsh -NoProfile -File test/cap6/run_cap6_gates.ps1 2>&1 |
            Tee-Object -FilePath build/cap6/gates.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6 headless gates FAILED' }

      - name: CAP-6 zero-network sweep over bundle/release sources
        shell: pwsh
        run: pwsh -NoProfile -File test/cap6/check_cap6_nonetwork.ps1

      - name: CAP-6 release runtime smoke - app.pwb over pweb://app
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File test/cap6/run_cap6_smoke.ps1

      - name: CAP-6 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap6-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap6/gates.log
            build/cap6/smoke-release.log
            build/cap6/app.pwb
            build/cap6/app-rebuild.pwb
            build/cap6/maps.pwb
            build/cap6/maps-optin.pwb
            build/cap6/minrt.pwb
            build/cap6/limited.pwb
            build/cap6/release-tampered/app.pwb
            build/cap6/release-proto2/app.pwb

      # ------------------------- CAP-6b0 gates -------------------------
      # WebView2 runtime detection and provisioning foundation.
      # Everything below is additive; no earlier step is altered. The
      # headless policy/provisioning cases (pweb.test.webview2runtime)
      # already ran inside the PWeb test suite step above. CI NEVER
      # downloads or installs a runtime here: the lock/fetch gates run
      # over local fixtures only, and the host detection smoke merely
      # reports the runner's registry state as diagnostic evidence
      # (unavailable is a SKIP, only a crashed probe fails).

      - name: CAP-6b0 isolation compile - runtime detector unit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cap6b/fpc,
            build/cap6b/bin | Out-Null
          fpc -MObjFPC -Sh -B -FUbuild/cap6b/fpc `
            -Fusrc/platform/windows `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            src/platform/windows/pweb.platform.webview2.runtime.pas
          if ($LASTEXITCODE -ne 0) {
            throw 'pweb.platform.webview2.runtime.pas failed its isolation compile'
          }

      - name: CAP-6b0 minimum cross-check (Pascal constant vs CAP-4W patch)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap6b/check_wv2min.ps1

      - name: CAP-6b0 host WebView2 detection smoke (diagnostic evidence only)
        shell: pwsh
        timeout-minutes: 5
        run: pwsh -NoProfile -File test/cap6b/run_wv2probe.ps1

      - name: CAP-6b0 lock validator and fixture matrix (zero network)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/get-webview2-runtime.ps1 -Validate
          if ($LASTEXITCODE -ne 0) { throw 'webview2-runtime.lock validation FAILED' }
          pwsh -NoProfile -File test/cap6b/check_wv2lock.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b0 lock fixture matrix FAILED' }

      - name: CAP-6b0 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap6b0-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap6b/probe.log
            build/cap6b/fixtures/

      # ------------------------- CAP-6b1 gates -------------------------
      # Normal-profile Evergreen Bootstrapper provisioning installer.
      # Everything below is additive; no earlier step is altered. The
      # lock/Authenticode fixture matrix (including the new
      # authenticode-subject cases) already ran inside the CAP-6b0 lock
      # step above via the extended check_wv2lock.ps1, and the N1-N12
      # provisioning cases ran inside the PWeb test suite step. CI
      # fetches the LOCKED bootstrapper (sha256 + Authenticode subject
      # verified, drift fails the build and deletes the download) and
      # builds/validates the REAL setup.exe - but NEVER executes the
      # bootstrapper: on the hosted runner the AlreadyUsable skip path
      # is the proof, and the genuine provisioning proof is the
      # clean-machine VM gate (test/cap6b1/run_clean_machine_gate.ps1,
      # human-run, never mocked here).

      - name: CAP-6b1 isolation compile - provisioning unit + setup helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cap6b1/fpc,
            build/cap6b1/bin | Out-Null
          fpc -MObjFPC -Sh -B -FUbuild/cap6b1/fpc `
            -Fusrc/platform/windows `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt `
            src/platform/windows/pweb.platform.webview2.provision.pas
          if ($LASTEXITCODE -ne 0) {
            throw 'pweb.platform.webview2.provision.pas failed its isolation compile'
          }
          fpc -MObjFPC -Sh -B -FUbuild/cap6b1/fpc -FEbuild/cap6b1/bin `
            -Fusrc/platform/windows `
            -Fideps/mormot2/src -Fudeps/mormot2/src/core -Fudeps/mormot2/src/lib `
            -Fudeps/mormot2/src/crypt `
            tools/setup/pwebwv2prov.pas
          if ($LASTEXITCODE -ne 0) { throw 'pwebwv2prov helper compile failed' }

      - name: CAP-6b1 innosetup.lock fixture matrix (zero network)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap6b1/check_innosetup_lock.ps1

      - name: CAP-6b1 contract cross-checks (markers + helper prefixes)
        shell: pwsh
        run: pwsh -NoProfile -File test/cap6b1/check_cap6b1_contracts.ps1

      # build_normal_setup.ps1 re-invokes this fetch idempotently (the
      # sha-stamp cache makes the second call a no-op); the standalone
      # step exists for fail-fast attribution - a toolchain
      # provisioning failure is named here, never inside the build
      - name: CAP-6b1 fetch pinned Inno Setup 6 (sha256-verified, silent, bounded)
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File tools/get-innosetup.ps1

      - name: CAP-6b1 build normal setup.exe from the pinned locks
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap6b1/build_normal_setup.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b1-build.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b1 setup build FAILED' }

      - name: CAP-6b1 setup gates - skip path, layout, installed smoke, uninstall
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap6b1/run_normal_setup_gates.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b1-gates.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b1 setup gates FAILED' }

      - name: CAP-6b1 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap6b1-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap6b1-build.log
            build/cap6b1-gates.log
            build/cap6b1/setup-install.log
            build/cap6b1/setup-abort.log
            build/cap6b1/smoke-installed.log
            build/cap6b1/lockfacts.psd1
            build/cap6b1/is-fixtures/
            dist/windows/normal/setup.exe

      # ------------------------- CAP-6b2 gates -------------------------
      # Offline-profile Evergreen STANDALONE Installer provisioning.
      # Everything below is additive; no earlier step is altered. The
      # extended lock fixture matrix (standalone kind + two-artifact
      # real-lock proof) already ran inside the CAP-6b0 lock step
      # above, and the streaming-digest cases ran inside the PWeb test
      # suite step. CI fetches the LOCKED ~210 MB standalone (sha256 +
      # Authenticode subject verified, drift fails the build and
      # deletes the download) in a dedicated bounded step, builds the
      # REAL offline setup.exe with its payload-listing proof
      # (standalone present, bootstrapper absent), and runs the gates
      # - but NEVER executes any runtime installer: on the hosted
      # runner the AlreadyUsable skip path (installing from an
      # ISOLATED dir holding only setup.exe) is the proof, and the
      # genuine offline provisioning proof is the network-disabled
      # clean-machine VM gate
      # (test/cap6b2/run_offline_clean_machine_gate.ps1, human-run,
      # never mocked here).

      # dedicated bounded fetch for fail-fast attribution: an upstream
      # rotation of the ~210 MB artifact is named HERE, never inside
      # the build (which then reuses the verified local bytes after
      # re-verifying them against the lock)
      - name: CAP-6b2 fetch pinned Evergreen Standalone (sha256+authenticode, bounded, never executed)
        shell: pwsh
        timeout-minutes: 10
        run: |
          pwsh -NoProfile -File tools/get-webview2-runtime.ps1 `
            -Artifact evergreen-standalone-x64
          if ($LASTEXITCODE -ne 0) {
            throw 'locked standalone fetch-verify FAILED (upstream drift? re-ratify deliberately)'
          }

      - name: CAP-6b2 build offline setup.exe from the pinned locks (payload-listing proof)
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap6b2/build_offline_setup.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b2-build.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b2 offline setup build FAILED' }

      - name: CAP-6b2 offline setup gates - streamed V-legs, isolated-dir skip path, layout, smoke, uninstall
        shell: pwsh
        timeout-minutes: 15
        run: |
          pwsh -NoProfile -File test/cap6b2/run_offline_setup_gates.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b2-gates.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b2 offline setup gates FAILED' }

      # deliberate deviation from the CAP-6b1 diagnostics pattern: the
      # offline setup.exe (~200 MB) is NOT uploaded on failure - the
      # logs, listing and lockfacts below identify any defect, and the
      # binary is reproducible from the pinned locks; uploading it
      # would burn artifact quota for no diagnostic value
      - name: CAP-6b2 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap6b2-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap6b2-build.log
            build/cap6b2-gates.log
            build/cap6b2/iscc-offline.log
            build/cap6b2/setup-install.log
            build/cap6b2/smoke-installed.log
            build/cap6b2/lockfacts.psd1

      # ------------------------- CAP-6b3 gates -------------------------
      # Fixed-runtime profile: a bundled WebView2 Fixed Version Runtime
      # tree deployed as ordinary application content, selected by the
      # application itself before webview_create. Everything below is
      # additive; no earlier step is altered. The extended lock fixture
      # matrix (fixed kind + three-artifact real-lock proof) already ran
      # inside the CAP-6b0 lock step above, and the fixed validation /
      # ACL / manifest / selection cases ran inside the PWeb test suite
      # step. CI acquires the LOCKED ~290 MB cabinet (sha256 +
      # Authenticode subject verified, drift fails the build and deletes
      # the download) in a dedicated bounded step, expands it, builds the
      # REAL fixed setup.exe with its full-relative-path payload proof
      # (runtime tree present, BOTH Evergreen installers absent), and
      # runs the gates end to end - install, ACL verified by SID,
      # manifest equality, observed pinned identity, the no-fallback
      # negative legs and uninstall. Nothing is ever provisioned,
      # downloaded at run time or executed from Microsoft's installers
      # here: this profile has no provisioning path at all. The
      # runtime-absent proof is the human-run clean-machine VM gate
      # (test/cap6b3/run_fixed_clean_machine_gate.ps1, never mocked).

      # dedicated bounded fetch for fail-fast attribution: an upstream
      # rotation of the ~290 MB cabinet is named HERE, never inside the
      # build (which then reuses the verified local bytes after
      # re-verifying them against the lock)
      - name: CAP-6b3 fetch pinned Fixed Version Runtime (sha256+authenticode, bounded, never executed)
        shell: pwsh
        timeout-minutes: 20
        run: |
          pwsh -NoProfile -File tools/get-webview2-runtime.ps1 `
            -Artifact webview2-fixed-runtime-x64
          if ($LASTEXITCODE -ne 0) {
            throw 'locked fixed-runtime fetch-verify FAILED (upstream drift? re-ratify deliberately)'
          }

      # 45: the ~690 MB expansion, the CAP-3U-windowed host compile, the
      # native tree-version/manifest passes and TWO ISCC compiles over
      # the tree (the real setup plus the abort probe)
      - name: CAP-6b3 build fixed setup.exe from the pinned locks (expand + manifest + payload proof)
        shell: pwsh
        timeout-minutes: 45
        run: |
          pwsh -NoProfile -File test/cap6b3/build_fixed_setup.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b3-build.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b3 fixed setup build FAILED' }

      # 75: the gate script's OWN bounded waits can sum past an hour in
      # the worst case (install 20 min + two manifest verifies 10 min
      # each + smoke/control/negative legs + uninstall 10 min + the
      # abort probe 20 min), and a step budget below its script's sum
      # would kill a healthy run before the script could report
      - name: CAP-6b3 fixed setup gates - install, ACL by SID, manifest, observed identity, no-fallback, uninstall, abort probe
        shell: pwsh
        timeout-minutes: 75
        run: |
          pwsh -NoProfile -File test/cap6b3/run_fixed_setup_gates.ps1 2>&1 |
            Tee-Object -FilePath build/cap6b3-gates.log
          if ($LASTEXITCODE -ne 0) { throw 'CAP-6b3 fixed setup gates FAILED' }

      # same deliberate deviation as CAP-6b2: the fixed setup.exe
      # (~276 MB) is NOT uploaded on failure - the logs, listing and
      # lockfacts below identify any defect, and the binary is
      # reproducible from the pinned locks
      - name: CAP-6b3 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap6b3-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cap6b3-build.log
            build/cap6b3-gates.log
            build/cap6b3/iscc-fixed.log
            build/cap6b3/setup-install.log
            build/cap6b3/setup-abort.log
            build/cap6b3/smoke-installed.log
            build/cap6b3/smoke-installed.err.log
            build/cap6b3/lockfacts.psd1
            build/cap6b3/tree.manifest

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap1-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test/abi_c.txt
            build/test/abi_pascal.txt
            build/webview-dist/webview.dll
            build/cap4w/probe/Release/cap4w_probe.exe
            build/cap3u/compile.log
            build/cap3u/binary.log
            build/cap3u/runtime.log
            build/cap3u/bin/cap3u_unwind.map
            build/cap3/bin/cap3tests.exe
            build/cap3/example/mormotrpc.exe
            build/cap4/example/assetsapp.exe
            build/cap4/example/app.zip
