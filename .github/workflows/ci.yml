      # if-no-files-found: ERROR, not ignore. The measurement IS the
      # deliverable of this shard, so a job that produced none and uploaded
      # nothing must not also report this step green - that is the shape of a
      # gate that passes while measuring nothing.
      - name: CAP-7M0 measurements (always uploaded - the shard's whole output)
