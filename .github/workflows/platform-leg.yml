        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-evidence-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/evidence

      - name: CAP-11A collect the leg records (attempt 1 of 3)
        id: collect_records_1
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-records-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/records

      - name: CAP-11A collect the leg records (attempt 2 of 3)
        id: collect_records_2
        if: ${{ always() && steps.collect_records_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-records-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/records

      - name: CAP-11A collect the leg records (attempt 3 of 3)
        id: collect_records_3
        if: ${{ always() && steps.collect_records_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-records-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/records

      - name: CAP-11A collect the leg release (attempt 1 of 3)
        id: collect_release_1
        if: ${{ (always()) && (inputs.target == 'macos-x64' || inputs.target == 'macos-arm64') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-release-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/release

      - name: CAP-11A collect the leg release (attempt 2 of 3)
        id: collect_release_2
        if: ${{ (always() && steps.collect_release_1.outcome == 'failure') && (inputs.target == 'macos-x64' || inputs.target == 'macos-arm64') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-release-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/release

      - name: CAP-11A collect the leg release (attempt 3 of 3)
        id: collect_release_3
        if: ${{ (always() && steps.collect_release_2.outcome == 'failure') && (inputs.target == 'macos-x64' || inputs.target == 'macos-arm64') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-release-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          path: build/cap11a/collect/release

      - name: CAP-11A collect the leg dist (attempt 1 of 3)
        id: collect_dist_1
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-dist-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: ${{ inputs.long_retention && 90 || 14 }}
          overwrite: true
          path: build/cap11a/collect/dist

      - name: CAP-11A collect the leg dist (attempt 2 of 3)
        id: collect_dist_2
        if: ${{ always() && steps.collect_dist_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-dist-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: ${{ inputs.long_retention && 90 || 14 }}
          overwrite: true
          path: build/cap11a/collect/dist

      - name: CAP-11A collect the leg dist (attempt 3 of 3)
        id: collect_dist_3
        if: ${{ always() && steps.collect_dist_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-dist-${{ inputs.target }}
          if-no-files-found: warn
          retention-days: ${{ inputs.long_retention && 90 || 14 }}
          overwrite: true
          path: build/cap11a/collect/dist

      - name: CAP-11A collect the leg diagnostics (attempt 1 of 1)
        id: collect_diagnostics_1
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-diagnostics-${{ inputs.target }}
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
          path: build/cap11a/collect/diagnostics

      # NEVER fails the leg - and neither can the staging step above it.
      # `continue-on-error` on BOTH is the difference between a typed
      # infrastructure state and a green leg turned red by a locked file: a
      # artifact service is green with `evidence_uploaded=false`, and the
      # aggregate refuses while NAMING it infrastructure. A leg that failed a
      # gate is red for that gate, which is a different sentence.
      - name: CAP-11A type the collection outcome
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          PWEB_UP_evidence_1: ${{ steps.collect_evidence_1.outcome }}
          PWEB_UP_evidence_2: ${{ steps.collect_evidence_2.outcome }}
          PWEB_UP_evidence_3: ${{ steps.collect_evidence_3.outcome }}
          PWEB_UP_records_1: ${{ steps.collect_records_1.outcome }}
          PWEB_UP_records_2: ${{ steps.collect_records_2.outcome }}
          PWEB_UP_records_3: ${{ steps.collect_records_3.outcome }}
          PWEB_UP_release_1: ${{ steps.collect_release_1.outcome }}
          PWEB_UP_release_2: ${{ steps.collect_release_2.outcome }}
          PWEB_UP_release_3: ${{ steps.collect_release_3.outcome }}
          PWEB_UP_dist_1: ${{ steps.collect_dist_1.outcome }}
          PWEB_UP_dist_2: ${{ steps.collect_dist_2.outcome }}
          PWEB_UP_dist_3: ${{ steps.collect_dist_3.outcome }}
        run: |
          pwsh -NoProfile -File test/cap11a/type_collection.ps1 -Target "${{ inputs.target }}"
          if ($LASTEXITCODE -ne 0) { throw 'CAP-11A collection typing FAILED' }
