name: 'CAP-10D2 the phase-wide CAP-10 ledger disposition (CL1-CL4)'
description: 'CAP-11A: the body of the "CAP-10D2 the phase-wide CAP-10 ledger disposition (CL1-CL4)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
