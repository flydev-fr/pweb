# CAP-4 runtime gate, same conditional hosted policy as CAP-4W: the
# same real frontend must load over pweb://app from BOTH stores with
# HTML/CSS/JS/secure-context PASS and the CAP-3 RPC still returning
# 42. A genuine failure gates; only an absent WebView2/desktop session
# (webview_create nil) records SKIP. Local runs stay authoritative.

name: 'CAP-4 dual-mode runtime (best effort, local gate authoritative)'
description: 'CAP-11A: the body of the "CAP-4 dual-mode runtime (best effort, local gate authoritative)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows
      shell: pwsh
      run: |
        Copy-Item build/webview-dist/webview.dll build/cap4/example/
        $env:PWEB_SMOKE_AUTOCLOSE_MS = '8000'
        $marker = 'via IAssetStore PASS'
        $failed = $false
        foreach ($mode in @('folder', 'zip')) {
          if ($mode -eq 'folder') {
            $target = 'examples/06-assets/frontend/dist'
          }
          else {
            $target = 'build/cap4/example/app.zip'
          }
          $out = & build/cap4/example/assetsapp.exe $mode $target 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if (($code -eq 0) -and ($out -match [regex]::Escape($marker))) {
            $verdict = "PASS - $mode mode served HTML/CSS/JS, secure context, RPC 42"
          }
          elseif ($out -match 'webview_create \(returned nil') {
            $verdict = "SKIP - no usable WebView2 runtime/desktop session on this runner (exit $code)"
          }
          else {
            $verdict = "FAIL - $mode mode exit $code or missing CAP-4 PASS marker (see log)"
            $failed = $true
          }
          "### CAP-4 runtime, $mode mode (conditional hosted gate)`n$verdict" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "assetsapp[$mode] verdict: $verdict"
        }
        if ($failed) { exit 1 }
