name: 'CAP-10C0 contract cross-checks (bounds, no shell at the link, no name-kill, env, shutdown order)'
description: 'CAP-11A: the body of the "CAP-10C0 contract cross-checks (bounds, no shell at the link, no name-kill, env, shutdown order)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows, linux, macos-x64, macos-arm64
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10c0/check_cap10c0_contracts.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10C0 contract cross-checks FAILED' }
