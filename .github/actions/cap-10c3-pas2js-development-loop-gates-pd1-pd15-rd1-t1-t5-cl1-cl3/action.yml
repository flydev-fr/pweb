name: 'CAP-10C3 pas2js development-loop gates (PD1-PD15, RD1, T1-T5, CL1-CL3) + evidence'
description: 'CAP-11A: the body of the "CAP-10C3 pas2js development-loop gates (PD1-PD15, RD1, T1-T5, CL1-CL3) + evidence" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows, macos-x64, macos-arm64
      if: ${{ inputs.target != 'linux' }}
      shell: bash
      run: |
        pwsh -NoProfile -File test/cap10c3/run_cap10c3_gates.ps1 2>&1 |
          tee build/cap10c3-gates.log
        test "${PIPESTATUS[0]}" -eq 0
    - name: linux
      if: ${{ inputs.target == 'linux' }}
      shell: bash
      run: |
        xvfb-run -a pwsh -NoProfile -File test/cap10c3/run_cap10c3_gates.ps1 2>&1 |
          tee build/cap10c3-gates.log
        test "${PIPESTATUS[0]}" -eq 0
