name: 'CAP-10B1 build the public pack, the CLI and the SDK root'
description: 'CAP-11A: the body of the "CAP-10B1 build the public pack, the CLI and the SDK root" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10b1/build_cap10b1.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10B1 build FAILED' }
    - name: linux, macos-x64, macos-arm64
      if: ${{ inputs.target != 'windows' }}
      shell: bash
      run: test/cap10b1/build_cap10b1.sh
