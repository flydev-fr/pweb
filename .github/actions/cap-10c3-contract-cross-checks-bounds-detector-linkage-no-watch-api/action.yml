name: 'CAP-10C3 contract cross-checks (bounds, detector linkage, no watch API, pas2js CSP + dev-free release)'
description: 'CAP-11A: the body of the "CAP-10C3 contract cross-checks (bounds, detector linkage, no watch API, pas2js CSP + dev-free release)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows, linux, macos-x64, macos-arm64
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10c3/check_cap10c3_contracts.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10C3 contract cross-checks FAILED' }
