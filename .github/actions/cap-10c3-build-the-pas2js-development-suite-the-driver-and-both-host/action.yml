name: 'CAP-10C3 build the pas2js development suite, the driver and both host binaries'
description: 'CAP-11A: the body of the "CAP-10C3 build the pas2js development suite, the driver and both host binaries" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10c3/build_cap10c3.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10C3 build FAILED' }
    - name: linux, macos-x64, macos-arm64
      if: ${{ inputs.target != 'windows' }}
      shell: bash
      run: test/cap10c3/build_cap10c3.sh
