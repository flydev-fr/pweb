name: 'CAP-6b1 setup gates - skip path, layout, installed smoke, uninstall'
description: 'CAP-11A: the body of the "CAP-6b1 setup gates - skip path, layout, installed smoke, uninstall" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
