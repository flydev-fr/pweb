name: 'CAP-10B2 contract cross-checks (two UIs, one native app, no npm)'
description: 'CAP-11A: the body of the "CAP-10B2 contract cross-checks (two UIs, one native app, no npm)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows, linux, macos-x64, macos-arm64
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10b2/check_cap10b2_contracts.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10B2 contract cross-checks FAILED' }
