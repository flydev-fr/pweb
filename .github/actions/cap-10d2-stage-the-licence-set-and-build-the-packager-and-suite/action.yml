name: 'CAP-10D2 stage the licence set and build the packager and suite'
description: 'CAP-11A: the body of the "CAP-10D2 stage the licence set and build the packager and suite" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: pwsh -NoProfile -File test/cap10d2/build_cap10d2.ps1
    - name: linux, macos-x64, macos-arm64
      if: ${{ inputs.target != 'windows' }}
      shell: bash
      run: test/cap10d2/build_cap10d2.sh
