name: 'ABI probe - C side (pinned headers, MSVC)'
description: 'CAP-11A: the body of the "ABI probe - C side (pinned headers, MSVC)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows
      shell: cmd
      run: |
        cl /nologo /W4 /WX /Ideps\webview\core\include test\core\abi_probe.c /Fobuild\test\ /Febuild\test\abi_probe_c.exe
        if errorlevel 1 exit /b 1
        build\test\abi_probe_c.exe > build\test\abi_c.txt
        if errorlevel 1 exit /b 1
        type build\test\abi_c.txt
