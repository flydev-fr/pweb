name: 'CAP-6b2 build the offline-profile setup from the pinned locks (payload-listing proof)'
description: 'CAP-11A: the body of the "CAP-6b2 build the offline-profile setup from the pinned locks (payload-listing proof)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap6b2/build_offline_setup.ps1 2>&1 |
          Tee-Object -FilePath build/cap6b2-build.log
