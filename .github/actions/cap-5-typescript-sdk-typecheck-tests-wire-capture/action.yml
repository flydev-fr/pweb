name: 'CAP-5 TypeScript SDK typecheck + tests + wire capture'
description: 'CAP-11A: the body of the "CAP-5 TypeScript SDK typecheck + tests + wire capture" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows
      shell: pwsh
      run: |
        $v = (node --version).Trim()
        if ($v -ne 'v24.11.1') { throw "expected node v24.11.1, got $v" }
        New-Item -ItemType Directory -Force build/cap5 | Out-Null
        Push-Location sdk/typescript
        try {
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'SDK npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript SDK tests FAILED' }
          npm run capture 2>&1 |
            Out-File -Encoding utf8 ../../build/cap5/ts-capture.log
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript SDK capture failed' }
        }
        finally { Pop-Location }
