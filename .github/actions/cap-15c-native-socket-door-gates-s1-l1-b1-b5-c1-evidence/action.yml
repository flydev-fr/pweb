name: 'CAP-15C native socket door gates (S1, L1, B1-B5, C1) + evidence'
description: 'CAP-11A: the body of the "CAP-15C native socket door gates (S1, L1, B1-B5, C1) + evidence" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    # THE COMPOSITION, Linux only and BEFORE the gate that reads its record.
    # It runs a real window, so it needs a display, and it needs the SDK root
    # CAP-10B1 staged and CAP-10C1 completed - both earlier in this sequence.
    # Every other CAP-15C claim is a property of a binary, of the source, or
    # of an exchange with a LOCAL witness, which is why only this one step is
    # scoped to one leg.
    - name: linux - the socket composition smoke
      if: ${{ inputs.target == 'linux' }}
      shell: bash
      run: |
        set -eu
        mkdir -p build
        xvfb-run -a test/cap15c/prove_cap15c_composition.sh 2>&1 |
          tee build/cap15c-composition.log
    - name: all targets
      shell: bash
      run: |
        # ALL THREE SCRIPTS RUN, AND THE STEP FAILS AFTERWARDS - the CAP-14A
        # rule. The contracts come first because they are checkout-only and
        # because the gates read their verdict (close_on_generation_switch),
        # but an `&&` between them would stop the gates writing
        # build/cap15c/cli-<target>.json, and the aggregate could then only
        # report "artifact absent" for a leg whose real cause was one field.
        #
        # NO DISPLAY IS NEEDED: every claim here is a property of a binary, of
        # the source, or of an exchange with a local witness.
        set +e
        mkdir -p build
        pwsh -NoProfile -File test/cap15c/check_cap15c_contracts.ps1 2>&1 |
          tee build/cap15c-contracts.log
        c=${PIPESTATUS[0]}
        pwsh -NoProfile -File test/cap15c/build_cap15c.ps1 2>&1 |
          tee build/cap15c-build.log
        b=${PIPESTATUS[0]}
        pwsh -NoProfile -File test/cap15c/run_cap15c_gates.ps1 2>&1 |
          tee build/cap15c-gates.log
        g=${PIPESTATUS[0]}
        set -e
        test "$c" -eq 0 -a "$b" -eq 0 -a "$g" -eq 0
