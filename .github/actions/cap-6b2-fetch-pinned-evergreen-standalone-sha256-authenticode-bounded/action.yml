# ------------------------- CAP-6b2 gates -------------------------
# Offline-profile Evergreen STANDALONE Installer provisioning.
# Everything below is additive; no earlier step is altered. The
# extended lock fixture matrix (standalone kind + two-artifact
# real-lock proof) already ran inside the CAP-6b0 lock step
# above, and the streaming-digest cases ran inside the PWeb test
# suite step. CI fetches the LOCKED ~210 MB standalone (sha256 +
# Authenticode subject verified, drift fails the build and
# deletes the download) in a dedicated bounded step, builds the
# REAL offline-profile setup with its payload-listing proof
# (standalone present, bootstrapper absent), and runs the gates
# - but NEVER executes any runtime installer: on the hosted
# runner the AlreadyUsable skip path (installing from an
# ISOLATED dir holding only that setup binary) is the proof, and the
# genuine offline provisioning proof is the network-disabled
# clean-machine VM gate
# (test/cap6b2/run_offline_clean_machine_gate.ps1, human-run,
# never mocked here).

# dedicated bounded fetch for fail-fast attribution: an upstream
# rotation of the ~210 MB artifact is named HERE, never inside
# the build (which then reuses the verified local bytes after
# re-verifying them against the lock)

name: 'CAP-6b2 fetch pinned Evergreen Standalone (sha256+authenticode, bounded, never executed)'
description: 'CAP-11A: the body of the "CAP-6b2 fetch pinned Evergreen Standalone (sha256+authenticode, bounded, never executed)" step of the one platform-leg sequence.'
runs:
  using: composite
  steps:
    - name: windows
      shell: pwsh
      run: |
        pwsh -NoProfile -File tools/get-webview2-runtime.ps1 `
          -Artifact evergreen-standalone-x64
        if ($LASTEXITCODE -ne 0) {
          throw 'locked standalone fetch-verify FAILED (upstream drift? re-ratify deliberately)'
        }
