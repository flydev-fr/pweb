name: 'CAP-10C1 complete the SDK root and build the pipeline driver'
description: 'CAP-11A: the body of the "CAP-10C1 complete the SDK root and build the pipeline driver" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10c1/build_cap10c1.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10C1 build FAILED' }
    - name: linux, macos-x64, macos-arm64
      if: ${{ inputs.target != 'windows' }}
      shell: bash
      run: test/cap10c1/build_cap10c1.sh
