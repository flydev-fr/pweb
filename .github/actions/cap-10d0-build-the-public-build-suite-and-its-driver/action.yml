name: 'CAP-10D0 build the public-build suite and its driver'
description: 'CAP-11A: the body of the "CAP-10D0 build the public-build suite and its driver" step of the one platform-leg sequence.'
inputs:
  target:
    description: 'windows | linux | macos-x64 | macos-arm64'
    required: true
runs:
  using: composite
  steps:
    - name: windows
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File test/cap10d0/build_cap10d0.ps1
        if ($LASTEXITCODE -ne 0) { throw 'CAP-10D0 build FAILED' }
    - name: linux, macos-x64, macos-arm64
      if: ${{ inputs.target != 'windows' }}
      shell: bash
      run: test/cap10d0/build_cap10d0.sh
